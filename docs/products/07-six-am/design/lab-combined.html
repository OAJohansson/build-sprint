<h1>Six AM · The Lab, Listen + Make combined</h1>
<p class="lede">Directions 3 (Two rooms) and 5 (Margin notes) from <a href="lab-directions-2.html" style="color:#f2b134">round 2</a>, in one rough prototype with one Listen/Make switch. Both modes share the same header, transport and notes. Same moment: Lost in The Loop, bar 97, Drop 1 looping, Bass soloed.</p>
<div class="grid">
  <figure>
