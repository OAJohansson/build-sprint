<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lab directions</title>
<style>
:root { color-scheme: dark; }
body { margin: 0; background: #131110; color: #f1e6d3; font: 14px/1.5 ui-monospace, "IBM Plex Mono", Menlo, monospace; }
main { max-width: 1200px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font: italic 400 32px/1.1 Georgia, serif; margin: 0 0 8px; }
p.lede { color: #aa9c88; margin: 0 0 24px; max-width: 640px; }
.grid { display: grid; grid-template-columns: 1fr; gap: 28px; }
@media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
figure { margin: 0; }
img { display: block; width: 100%; height: auto; border: 1px solid #2c2622; border-radius: 6px; }
figcaption { display: flex; gap: 12px; padding-top: 10px; }
figcaption b { flex: none; width: 28px; height: 28px; display: grid; place-items: center; border: 1px solid #f2b134; color: #f2b134; border-radius: 50%; font-weight: 500; }
figcaption strong { display: block; font-weight: 500; }
figcaption span { color: #aa9c88; }
figcaption strong { color: #f1e6d3; }
</style></head>
<body><main>
<h1>Six AM · The Lab, ten directions</h1>
<p class="lede">Rough prototypes, same moment in each: Lost in The Loop, 124 BPM, A minor, 7:44, 240 bars, bar 97 of the first Drop, the bass playing alone, the Deck connected. Pick three. Tap an image for full size.</p>
<div class="grid">
  <figure>
    <a href="lab/lab-01-map.png"><img src="lab/lab-01-map.png" alt="Direction 1, Map" loading="lazy" width="1440" height="900"></a>
    <figcaption><b>1</b><span><strong>Map</strong>The map as it is, with headphones on: four part lanes, click a name to hear it alone; Deck status and one gold action in the head; the Mentor's note under the map. (seed 1)</span></figcaption>
  </figure>
  <figure>
    <a href="lab/lab-02-columns.png"><img src="lab/lab-02-columns.png" alt="Direction 2, Columns" loading="lazy" width="1440" height="900"></a>
    <figcaption><b>2</b><span><strong>Columns</strong>Time runs down the page; the four parts stand side by side and the one you hear is wide; the Mentor and the action in a side column. (seed 2)</span></figcaption>
  </figure>
  <figure>
    <a href="lab/lab-03-tabs.png"><img src="lab/lab-03-tabs.png" alt="Direction 3, Tabs" loading="lazy" width="1440" height="900"></a>
    <figcaption><b>3</b><span><strong>Tabs</strong>The four parts are the page's big serif tabs; only the chosen part's lane shows, the Mentor as a quote and three knobs below. (seed 3)</span></figcaption>
  </figure>
  <figure>
    <a href="lab/lab-04-steps.png"><img src="lab/lab-04-steps.png" alt="Direction 4, Steps" loading="lazy" width="1440" height="900"></a>
    <figcaption><b>4</b><span><strong>Steps</strong>One step at a time: Listen, Understand, Make, Keep. A slim map on top; each step gets the whole page below it. Shown at Understand. (seed 4)</span></figcaption>
  </figure>
  <figure>
    <a href="lab/lab-05-bench.png"><img src="lab/lab-05-bench.png" alt="Direction 5, Bench" loading="lazy" width="1440" height="900"></a>
    <figcaption><b>5</b><span><strong>Bench</strong>Everything visible: the map on the left, a workbench on the right with Theirs/Yours, Shape/Describe, the Mentor's knob settings and Save.</span></figcaption>
  </figure>
  <figure>
    <a href="lab/lab-06-mentor.png"><img src="lab/lab-06-mentor.png" alt="Direction 6, Mentor" loading="lazy" width="1440" height="900"></a>
    <figcaption><b>6</b><span><strong>Mentor</strong>The Mentor leads: a conversation column, part chips and a one-line map strip above it; actions come as replies.</span></figcaption>
  </figure>
  <figure>
    <a href="lab/lab-07-room.png"><img src="lab/lab-07-room.png" alt="Direction 7, Room" loading="lazy" width="1440" height="900"></a>
    <figcaption><b>7</b><span><strong>Room</strong>The listening room: almost nothing on screen, the part you hear in huge type, one Mentor line, parts on keys 1 to 4, a strip at the foot.</span></figcaption>
  </figure>
  <figure>
    <a href="lab/lab-08-crate.png"><img src="lab/lab-08-crate.png" alt="Direction 8, Crate" loading="lazy" width="1440" height="900"></a>
    <figcaption><b>8</b><span><strong>Crate</strong>Your sound library frames the screen: My sounds on the left with a 'new bass, from this one' slot; the map in the middle.</span></figcaption>
  </figure>
  <figure>
    <a href="lab/lab-09-subtitles.png"><img src="lab/lab-09-subtitles.png" alt="Direction 9, Subtitles" loading="lazy" width="1440" height="900"></a>
    <figcaption><b>9</b><span><strong>Subtitles</strong>The map fills the screen; the Mentor speaks in a film-subtitle line in a bottom dock beside the Deck control and the action.</span></figcaption>
  </figure>
  <figure>
    <a href="lab/lab-10-chain.png"><img src="lab/lab-10-chain.png" alt="Direction 10, Chain" loading="lazy" width="1440" height="900"></a>
    <figcaption><b>10</b><span><strong>Chain</strong>Sounds wrong: a pedalboard. Five boxes wired left to right, Deck → Part → Mentor → Yours → Keep.</span></figcaption>
  </figure>
</div>
</main></body></html>
