<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#131110">
<title>Six AM · Make for every layer · round 1 (Fold, Twin, Drawer)</title>
<style>
@font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 400; font-display: block; src: url(fonts/IBMPlexMono-normal-400.woff2) format("woff2"); }
@font-face { font-family: "IBM Plex Mono"; font-style: normal; font-weight: 500; font-display: block; src: url(fonts/IBMPlexMono-normal-500.woff2) format("woff2"); }
@font-face { font-family: "Instrument Serif"; font-style: italic; font-weight: 400; font-display: block; src: url(fonts/InstrumentSerif-italic-400.woff2) format("woff2"); }
@font-face { font-family: "Instrument Serif"; font-style: normal; font-weight: 400; font-display: block; src: url(fonts/InstrumentSerif-normal-400.woff2) format("woff2"); }
/* Round 1 of the owner's three (L223): Fold, Twin, Drawer.
   ?v=1..3 picks the direction; ?s=drums|weak|wait|melody|fx|bass picks the state; ?shot=1 hides the picker. */
:root { color-scheme: dark; --bg:#131110; --line:#2b2622; --line2:#3a322c; --ink:#f1e6d3; --mute:#aa9c88; --dim:#958a7a; --gold:#f2b134; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace; --serif:"Instrument Serif", Georgia, serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.5 var(--mono); -webkit-font-smoothing: antialiased; overflow: hidden; font-variant-numeric: tabular-nums; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
button:focus-visible, input:focus-visible, [role="slider"]:focus-visible { outline: 2px solid rgba(241,230,211,.6); outline-offset: 2px; border-radius: 6px; }
button:disabled { cursor: default; }
.app { display: grid; grid-template-rows: 64px 96px 1fr; grid-template-columns: minmax(0, 1fr); height: 100vh; min-width: 1280px; }
.bar { display: flex; align-items: center; gap: 28px; padding: 0 22px; border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: center; gap: 12px; padding-right: 26px; border-right: 1px solid var(--line); height: 100%; }
.logo i { width: 26px; height: 26px; border-radius: 50%; background: radial-gradient(circle at 50% 60%, #f2b134 0 30%, #ef5b37 31% 52%, #23b3a5 53% 70%, #221d1a 71%); }
.logo b { font: italic 400 28px var(--serif); }
.nav a { color: var(--mute); margin-right: 22px; text-decoration: none; padding: 20px 0; }
.nav a.on { color: var(--ink); box-shadow: inset 0 -2px var(--gold); }
.head { display: flex; align-items: center; gap: 28px; padding: 0 22px; border-bottom: 1px solid var(--line); }
.back { color: var(--mute); white-space: nowrap; }
.title { min-width: 0; flex: 1; }
.title h1 { margin: 0; font: italic 400 28px/1.15 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.title p { margin: 4px 0 0; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.transport { display: grid; gap: 6px; justify-items: start; flex: none; }
.tr1 { display: flex; align-items: center; gap: 12px; white-space: nowrap; }
.play { width: 36px; height: 36px; border-radius: 50%; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-weight: 600; }
.small { color: var(--mute); font-size: 12px; }
.loopchip { border: 1px solid #6b5426; color: var(--gold); border-radius: 6px; padding: 3px 10px; font-size: 12px; white-space: nowrap; }
.lm { display: flex; border: 1px solid var(--line2); border-radius: 999px; padding: 3px; flex: none; }
.lm span { padding: 6px 18px; border-radius: 999px; font: italic 20px/1 var(--serif); color: var(--mute); }
.lm span.on { background: #2f2925; color: var(--ink); }
.deck { color: var(--mute); white-space: nowrap; } .deck::before { content: "●"; color: #7fbf6a; margin-right: 6px; font-size: 10px; }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 340px; min-height: 0; }
.col { display: flex; flex-direction: column; min-height: 0; min-width: 0; padding: 0 40px; }
.mid { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.rail { border-left: 1px solid var(--line); padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.rail h2 { margin: 0; font-weight: 400; color: var(--mute); font-size: 12px; }
.bubble { align-self: flex-end; background: #2b2622; border-radius: 10px; padding: 8px 12px; max-width: 260px; }
.tag { align-self: flex-end; color: var(--mute); font-size: 12px; text-decoration: underline; text-underline-offset: 3px; }
.answer { line-height: 1.75; margin: 0; }
.facts { color: var(--mute); font-size: 12px; margin: 0; }
.composer { margin-top: auto; border: 1px solid var(--line2); border-radius: 8px; padding: 12px 14px; color: var(--dim); display: flex; justify-content: space-between; align-items: center; }
.composer button { width: 28px; height: 28px; border-radius: 50%; background: #2b2622; display: grid; place-items: center; color: var(--dim); }
/* family switch */
.fam { display: flex; align-items: center; gap: 22px; height: 52px; border-bottom: 1px solid var(--line); flex: none; }
.fam .f { color: var(--mute); padding: 15px 0; transition: color 150ms ease-out; }
.fam .f:hover { color: var(--ink); }
.fam .f.on { color: var(--ink); box-shadow: inset 0 -2px var(--ink); }
.fam .f i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; vertical-align: 1px; }
.fam .f.off { color: var(--dim); cursor: default; }
.fam .f.off em { font-style: normal; font-size: 11px; border: 1px solid var(--line2); border-radius: 4px; padding: 1px 6px; margin-left: 6px; }
.fam .cap { margin-left: auto; color: var(--mute); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
/* frame pieces */
.preset { font: italic 30px/1 var(--serif); white-space: nowrap; padding: 4px 0; text-align: left; align-self: flex-start; }
.preset small, .presetS small { font: 13px var(--mono); color: var(--mute); margin-left: 6px; font-style: normal; }
.presetS { font: italic 22px/1 var(--serif); white-space: nowrap; padding: 6px 0; text-align: left; }
.preset:hover, .presetS:hover { color: #fff; }
.knob { display: grid; justify-items: center; gap: 2px; }
.knob span { font-size: 13px; } .knob small { color: var(--mute); font-size: 12px; }
.knob.sm span { font-size: 12px; } .knob.sm small { font-size: 12px; }
.knob.off { opacity: .45; }
.suggest { display: flex; align-items: center; gap: 16px; }
.suggest p { margin: 0; flex: 1; } .suggest p span { color: var(--mute); }
.ghost { border: 1px solid var(--line2); border-radius: 999px; padding: 0 16px; height: 34px; white-space: nowrap; transition: border-color 150ms ease-out, transform 160ms ease-out; }
.ghost:hover { border-color: #6f665b; }
.ghost:active, .gold:active { transform: scale(0.97); }
.ghost.sm { height: 28px; padding: 0 12px; font-size: 12px; }
.ghost:disabled { color: var(--dim); border-color: var(--line); }
.check { display: flex; align-items: center; gap: 16px; height: 64px; border-top: 1px solid var(--line); flex: none; }
.ab { display: flex; border: 1px solid var(--line2); border-radius: 999px; padding: 3px; }
.ab button { padding: 0 16px; height: 34px; border-radius: 999px; color: var(--mute); white-space: nowrap; }
.ab button[aria-pressed="true"] { background: #2f2925; color: var(--ink); }
.ab button:disabled { color: #6f665b; }
.score { margin-left: auto; display: flex; align-items: baseline; gap: 8px; color: var(--mute); white-space: nowrap; }
.score b { font: 500 22px var(--mono); color: var(--ink); }
.save { display: flex; align-items: center; gap: 14px; height: 76px; border-top: 1px solid var(--line); background: #171412; flex: none; margin: 0 -40px; padding: 0 40px; }
.save input { background: var(--bg); border: 1px solid var(--line2); border-radius: 6px; color: var(--ink); font: 14px var(--mono); padding: 0 14px; height: 44px; width: 340px; min-width: 0; text-overflow: ellipsis; }
.save .tags { color: var(--mute); font-size: 12px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gold { background: var(--gold); color: #1a1408; border-radius: 999px; padding: 0 20px; height: 44px; font-weight: 500; white-space: nowrap; transition: transform 160ms ease-out; flex: none; }
.gold:disabled { background: #3a322c; color: var(--dim); }
.mute { color: var(--mute); }
.lbl { font-size: 12px; color: var(--mute); }
.rowname { font-size: 14px; }
.savedmark { color: var(--mute); font-size: 12px; white-space: nowrap; }
.savedmark::before { content: "✓ "; color: #7fbf6a; }
.note { color: var(--ink); font-size: 12px; line-height: 1.6; }
.note span { color: var(--mute); }
.unsure { font-size: 11px; border: 1px dashed #6f665b; color: var(--mute); border-radius: 4px; padding: 0 6px; white-space: nowrap; }
.textbtn { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; font-size: 12px; padding: 4px 0; }
.wait { color: var(--ink); }
.wait span { color: var(--mute); }
/* picker (verbatim, PICKER.md) */
.proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
.proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
.proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
@media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } .ghost, .gold, .fam .f { transition: none; } }
.proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }
.proto-picker-item:active { transform: scale(0.97); }
.proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }
.proto-picker-item[data-active] { color: #fff; }
.proto-picker-divider { width: 1px; height: 16px; margin: 0 4px; background: rgba(255, 255, 255, 0.12); }
.proto-picker[data-position="top"] { bottom: auto; top: 24px; }
body.shot .proto-picker { display: none; }
</style></head>
<body>
<div id="stage"></div>
<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Fold</button>
  <button class="proto-picker-item">Twin</button>
  <button class="proto-picker-item">Drawer</button>
</nav>
<script>
const C = { ink: "#f1e6d3", gold: "#f2b134", drums: "#f2b134", bass: "#ef5b37", other: "#23b3a5", vox: "#cdbfa8", mute: "#aa9c88" };
const params = new URLSearchParams(location.search);
const STATE = params.get("s") || "drums";
if (params.get("shot")) document.body.classList.add("shot");

// ---------- tracks ----------
// Main: Lost in The Loop, Drop 1, bars 97–104 (8 bars). Weak: Tim Deluxe, the Breakdown, bars 57–72 (16 bars, hats only).
const TRACKS = {
  main: { title: "Lost in The Loop", facts: "Mason Flint · 124 BPM · key A minor", pos: "3:11 · in Drop 1", bar: "bar 99", chip: "Looping Drop 1 · 3:06–3:21 ×", sec: "Drop 1", clock: "3:06–3:21", bar0: 97, bars: 8, ph: [2, 6] },
  weak: { title: "Tim Deluxe [Feat.] Sam Obernik - It Just Won't Do (Mason Flint Remix)", facts: "Mason Flint · 126.1 BPM · key G minor", pos: "1:58 · in Breakdown", bar: "bar 62", chip: "Looping Breakdown · 1:47–2:17 ×", sec: "Breakdown", clock: "1:47–2:17", bar0: 57, bars: 16, ph: [5, 8] },
};
const T = STATE === "weak" ? TRACKS.weak : TRACKS.main;

// ---------- drum readings (shaped like drums-read.ts: per-step velocity, offsets in ms, swing) ----------
const grid = (bars, f) => [...Array(bars)].map((_, b) => [...Array(16)].map((_, s) => f(b, s)));
// Drop 1: four on the floor; a tom fill in bar 104 lands in the kick row (spike weak spot 6); clap on 2 and 4 with a roll into 105;
// hats: open on the off-beats, closed 16ths between; the hats under the kicks were dropped as leak (weak spot 4).
const MAIN = {
  kick: grid(8, (b, s) => (b === 7 ? ({ 0: 1, 4: 1, 8: 1, 10: 0.55, 11: 0.5, 14: 0.6 }[s] || 0) : s % 4 === 0 ? 0.92 + ((b * 3 + s) % 5) * 0.02 : b === 3 && s === 15 ? 0.42 : 0)),
  clap: grid(8, (b, s) => (s === 4 || s === 12 ? 0.9 : b === 7 && s > 12 ? 0.35 + (s - 12) * 0.18 : 0)),
  hats: grid(8, (b, s) => (s % 4 === 2 ? 0.9 : s % 2 === 1 ? 0.38 + ((b + s) % 3) * 0.04 : 0)),
};
// Breakdown: hats only; bleed from the bass and the pads reads as a few faint kicks and claps (weak spot 3).
const WEAK = {
  kick: grid(16, (b, s) => ({ "2,0": 0.22, "6,8": 0.18, "11,0": 0.26 }[`${b},${s}`] || 0)),
  clap: grid(16, (b, s) => ({ "4,12": 0.2, "9,4": 0.17 }[`${b},${s}`] || 0)),
  hats: grid(16, (b, s) => (s % 2 === 0 ? (s % 4 === 2 ? 0.85 : 0.5) : b >= 12 ? 0.35 : 0)),
};
const count = (d) => d.flat().filter((v) => v > 0).length;
const R = STATE === "weak" ? WEAK : MAIN;
const ROWS = [
  { id: "kick", name: "Kick", lane: "Kick", data: R.kick, preset: "Deep 909", saved: false,
    knobs: [["Tune", 0.38, "A1 · 55 Hz", 0.3], ["Decay", 0.42, "1/8", 0.3], ["Click", 0.25, "soft", 0.55], ["Drive", 0.2, "warm", null]],
    timing: "on the grid ±2 ms", close: 48 },
  { id: "clap", name: "Clap & snare", lane: "Claps & snares", data: R.clap, preset: "Wide clap", saved: true,
    knobs: [["Tone", 0.55, "bright", 0.48], ["Decay", 0.35, "short", null], ["Spread", 0.6, "3 hands", 0.7], ["Room", 0.3, "small", 0.15]],
    timing: "3 ms early", close: 61 },
  { id: "hats", name: "Hats", lane: "Hats", data: R.hats, preset: "Open 909", saved: false,
    knobs: [["Tone", 0.7, "bright", null], ["Length", 0.5, "open", 0.62], ["Swing", 0.54, "+8 ms", 0.58], ["Width", 0.2, "narrow", null]],
    timing: "off-beats 8 ms late (swing)", close: 57 },
];
if (STATE === "weak") { ROWS[0].unsure = ROWS[1].unsure = true; ROWS[1].saved = false; ROWS[0].close = ROWS[1].close = null; ROWS[2].close = 52; ROWS[2].timing = "on the grid ±3 ms"; ROWS[2].preset = "Closed tick"; }
const WAIT = STATE === "wait";
const row = ROWS[0];

// ---------- drawing ----------
function knob(name, v, word, tick, size = 84, color = C.ink, cls = "", off = false) {
  const a0 = -135, a = a0 + 270 * v, r = size / 2 - 6, c = size / 2;
  const pt = (d, rr = r) => [c + rr * Math.sin(d * Math.PI / 180), c - rr * Math.cos(d * Math.PI / 180)];
  const [x0, y0] = pt(a0), [x1, y1] = pt(a), [xe, ye] = pt(135);
  let t = "";
  if (tick != null && !off) { const sa = a0 + 270 * tick; const [p1, q1] = pt(sa, r + 5), [p2, q2] = pt(sa, r - 5); t = `<line x1="${p1}" y1="${q1}" x2="${p2}" y2="${q2}" stroke="${C.gold}" stroke-width="2.5" stroke-linecap="round"/>`; }
  return `<div class="knob ${cls} ${off ? "off" : ""}" role="slider" tabindex="${off ? -1 : 0}" aria-label="${name}" aria-valuetext="${word}" ${off ? 'aria-disabled="true"' : ""}><svg width="${size}" height="${size}" aria-hidden="true">
  <path d="M${x0} ${y0} A${r} ${r} 0 1 1 ${xe} ${ye}" fill="none" stroke="rgba(241,230,211,.25)" stroke-width="2" stroke-linecap="round"/>
  <path d="M${x0} ${y0} A${r} ${r} 0 ${a - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}" fill="none" stroke="${color}" stroke-width="3" stroke-linecap="round"/>${t}</svg>
  <span>${name}</span><small>${word}</small></div>`;
}
const knobsOf = (r, size, cls = "") => r.knobs.map(([n, v, w, t]) => knob(n, v, w, t, size, C.ink, cls, WAIT)).join("");
// A step pattern; velocity = height. Unsure rows draw hollow outlines. Waiting draws empty bars only.
// `lines` > 1 wraps the loop into lines of bars/lines bars each (loops of 16 bars stay readable).
function pattern(data, w, h, { faint = false, gap = 6, lines = 1, unsure = false, empty = WAIT, playhead = true, lineGap = 8, from = 0 } = {}) {
  const bars = data.length, per = Math.ceil(bars / lines), sw = (w - gap * (per - 1)) / (per * 16);
  const lh = (h - lineGap * (lines - 1)) / lines;
  let out = "";
  for (let b = 0; b < bars; b++) {
    const li = Math.floor(b / per), bx = (b % per) * (16 * sw + gap), y0 = li * (lh + lineGap);
    out += `<rect x="${bx}" y="${y0}" width="${16 * sw}" height="${lh}" fill="rgba(241,230,211,.04)" rx="2"/>`;
    for (let s = 4; s < 16; s += 4) out += `<rect x="${bx + s * sw - 0.5}" y="${y0 + lh * 0.25}" width="1" height="${lh * 0.5}" fill="rgba(241,230,211,.07)"/>`;
    if (empty) continue;
    for (let s = 0; s < 16; s++) {
      const v = data[b][s]; if (!v) continue;
      const x = bx + s * sw, hh = Math.max(4, lh * (0.3 + 0.7 * v)), ww = Math.max(1.5, sw - 1.5);
      out += unsure && v < 0.3
        ? `<rect x="${x + 1.25}" y="${y0 + lh - hh + 0.5}" width="${Math.max(1, ww - 1)}" height="${hh - 1}" fill="none" stroke="${C.drums}" stroke-width="1" stroke-dasharray="2 2" opacity=".8" rx="1"/>`
        : `<rect x="${x + 0.75}" y="${y0 + lh - hh}" width="${ww}" height="${hh}" fill="${C.drums}" opacity="${faint ? 0.45 : 0.4 + 0.6 * v}" rx="1"/>`;
    }
  }
  const pbA = T.ph[0] - from;
  if (playhead && !empty && pbA >= 0 && pbA < bars) { const pb = pbA, ps = T.ph[1], li = Math.floor(pb / per); const px = (pb % per) * (16 * sw + gap) + ps * sw; out += `<rect x="${px}" y="${li * (lh + lineGap) - 3}" width="1.5" height="${lh + 6}" fill="#fff"/>`; }
  return `<svg width="${w}" height="${h}" style="overflow:visible;display:block" aria-hidden="true">${out}</svg>`;
}
function barNumbers(w, { gap = 6, bars = T.bars, every = 1, from = 0 } = {}) {
  const bw = (w - gap * (bars - 1)) / bars;
  return `<div style="position:relative;height:18px;width:${w}px" aria-hidden="true">${[...Array(bars)].map((_, b) => b % every ? "" : `<span class="lbl" style="position:absolute;left:${b * (bw + gap)}px">${T.bar0 + from + b}</span>`).join("")}</div>`;
}

function wrapped(data, w, h, opts = {}) {
  if (data.length <= 8) return barNumbers(w, { gap: opts.gap ?? 6 }) + pattern(data, w, h, opts);
  let out = "";
  for (let from = 0; from < data.length; from += 8) out += `<div style="margin-top:${from ? 8 : 0}px">${barNumbers(w, { gap: 6, bars: 8, from })}${pattern(data.slice(from, from + 8), w, h * 0.62, { ...opts, gap: 6, from })}</div>`;
  return out;
}
// melody (spike-shaped: Am7 F C G stabs on the off-beats; a lead above; one stray note read)
const CH = [["Am7", [57, 60, 64, 67]], ["F", [57, 60, 65]], ["C", [55, 60, 64]], ["G", [55, 59, 62]]];
const NOTES = [];
for (let b = 0; b < 8; b++) { const c = CH[Math.floor(b / 2)]; for (const st of [2, 6, 10, 14]) for (const n of c[1]) NOTES.push({ b, s: st, len: 1.5, n }); }
NOTES.push({ b: 5, s: 7, len: 1, n: 66, stray: true });
const LEAD = [[0, 0, 4, 69], [0, 6, 2, 72], [1, 0, 6, 71], [2, 8, 4, 69], [3, 0, 3, 67], [3, 4, 2, 69], [4, 0, 6, 72], [5, 8, 4, 74], [6, 0, 8, 72], [7, 8, 6, 71]].map(([b, s, len, n]) => ({ b, s, len, n }));
function roll(notes, w, h, { color = C.other, lo = 52, hi = 77, gap = 6, dim = false } = {}) {
  const sw = (w - gap * 7) / 128, rh = h / (hi - lo); let out = "";
  for (let b = 0; b < 8; b++) out += `<rect x="${b * (16 * sw + gap)}" y="0" width="${16 * sw}" height="${h}" fill="rgba(241,230,211,.04)" rx="2"/>`;
  for (const n of notes) { const x = n.b * (16 * sw + gap) + n.s * sw; out += `<rect x="${x + 0.5}" y="${h - (n.n - lo + 1) * rh + 0.5}" width="${Math.max(2, n.len * sw - 1)}" height="${Math.max(2, rh - 1)}" fill="${color}" opacity="${dim ? 0.45 : 0.9}" rx="1.5"/>`; }
  const px = 2 * (16 * sw + gap) + 6 * sw; out += `<rect x="${px}" y="-3" width="1.5" height="${h + 6}" fill="#fff"/>`;
  return `<svg width="${w}" height="${h}" style="overflow:visible;display:block" aria-hidden="true">${out}</svg>`;
}

  for (let i = 0; i <= 80; i++) { const x = (i / 80) * pw, t = i / 80; const y = t < 0.25 ? 4 + t * 90 : t < 0.75 ? 26 + Math.sin(i) * 2 : 30 - (t - 0.75) * 104; env += `L${x.toFixed(1)} ${y.toFixed(1)} `; }
  env += `L${pw} 32 L0 32 Z`;
  const rows = FX.map((f, i) => `<div style="display:grid;grid-template-columns:140px 1fr;align-items:center;height:38px"><button style="text-align:left;${i === 2 ? "" : "color:var(--mute)"}" aria-pressed="${i === 2}">${f.name}</button>${fxShape(f, pw - 140, 28, i === 2)}</div>`).join("");
  return `<div style="padding-top:12px"><div style="margin-left:184px">${barNumbers(pw - 140, { bars: 8 })}</div>
    <div style="display:grid;grid-template-columns:44px 140px 1fr;align-items:center"><span class="lbl">heard</span><span class="lbl">level</span><svg width="${pw - 140}" height="32" aria-hidden="true"><path d="${env}" fill="${C.ink}" opacity=".2"/></svg></div>
    <div style="display:grid;grid-template-columns:44px 1fr;margin-top:6px"><span class="lbl" style="padding-top:10px">mine</span><div>${rows}</div></div></div>
    <div style="display:flex;align-items:center;gap:16px;margin:14px 0 4px">${presetBtn("Bright noise")}<span class="lbl">Noise riser · ${FX[2].why}</span></div>
    <div style="display:flex;gap:84px;margin:4px 0 10px">${FX[2].k.map(([n, v, wd]) => knob(n, v, wd, n === "Tone" ? 0.55 : null, 76, C.vox)).join("")}</div>
    ${suggestLine("Mentor: Tone up a little; the original noise is bright.", "Suggest for riser")}<div style="flex:1"></div>`;
}

// ---------- 3 Drawer ----------
function drawerDrums() {
  const lw = 540, gap = T.bars > 8 ? 3 : 4, foc = STATE === "weak" ? 2 : 0, fr = ROWS[foc];
  const lane = (x, i) => { const on = i === foc; return `<div style="display:grid;grid-template-columns:130px ${lw}px;align-items:center;gap:12px;min-height:${on ? 104 : 76}px;padding:10px 0;border-bottom:1px solid var(--line);${on ? "background:rgba(241,230,211,.045);box-shadow:inset 2px 0 var(--ink)" : ""}">
      <button style="text-align:left;padding-left:12px;align-self:start" aria-pressed="${on}"><span class="rowname">${x.lane}</span><br><span class="lbl">${x.saved ? "✓ saved" : x.preset}</span></button>
      <div>${on && T.bars > 8 ? wrapped(x.data, lw, 50, {}) : pattern(x.data, lw, on ? 50 : 30, { faint: !on, gap, unsure: x.unsure })}${x.unsure ? `<p class="note" style="margin:6px 0 0">${unsureNote(x)}</p>` : ""}</div></div>`; };
  const drawer = `<div style="border-left:1px solid var(--line);padding:6px 0 0 24px;display:flex;flex-direction:column;gap:12px;min-width:0">
      <span class="lbl">${fr.lane} lane · ${fr.timing}</span>${presetBtn(fr.preset)}
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 8px;justify-items:center">${knobsOf(fr, 76)}</div>
      ${WAIT ? `<p class="wait" style="margin:0">Filling the loop… 11 s<br><span>then your drums appear here.</span></p>` : `<p style="margin:0">${STATE === "weak" ? "Mentor: Length up, Tone down a little. The original hats are closed and soft." : "Mentor: Tune down to A1, Click up."}<br><span class="mute">Gold ticks mark those.</span></p><button class="ghost" style="align-self:flex-start">Suggest for ${fr.lane.toLowerCase()}</button>`}</div>`;
  return `<div style="display:grid;grid-template-columns:${130 + 12 + lw + 20}px minmax(0,1fr);flex:1;min-height:0;padding-top:12px">
      <div>${T.bars > 8 ? "" : `<div style="margin-left:142px">${barNumbers(lw, { gap })}</div>`}${ROWS.map(lane).join("")}</div>${drawer}</div>`;
}
function drawerMelody() {
  const lw = 560;
  return `<div style="display:grid;grid-template-columns:${142 + lw + 20}px minmax(0,1fr);flex:1;padding-top:12px"><div><div style="margin-left:142px">${chordsLine(lw, 6)}</div>
    <div style="display:grid;grid-template-columns:130px ${lw}px;gap:12px;align-items:center;min-height:150px;border-bottom:1px solid var(--line);background:rgba(241,230,211,.045);box-shadow:inset 2px 0 var(--ink)"><button style="text-align:left;padding-left:12px;align-self:start;padding-top:10px" aria-pressed="true"><span class="rowname">Chords</span><br><span class="lbl">Stab</span></button>${roll(NOTES, lw, 124)}</div>
    <div style="display:grid;grid-template-columns:130px ${lw}px;gap:12px;align-items:center;min-height:76px;border-bottom:1px solid var(--line)"><button style="text-align:left;padding-left:12px" aria-pressed="false"><span class="rowname">Lead</span><br><span class="lbl">Pluck</span></button>${roll(LEAD, lw, 40, { dim: true })}</div></div>
    <div style="border-left:1px solid var(--line);padding:6px 0 0 24px;display:flex;flex-direction:column;gap:12px"><span class="lbl">Chords lane · up to 4 notes at once</span>${presetBtn("Stab")}<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px 4px;justify-items:center">${melKnobs.map(([n, v, wd, t]) => knob(n, v, wd, t, 64, C.other, "sm")).join("")}</div><p style="margin:0">Mentor: Length down to 1/16, Space up.<br><span class="mute">Gold ticks mark those.</span></p><button class="ghost" style="align-self:flex-start">Suggest for chords</button></div></div>`;
}
function drawerFx() {
  const lw = 560;
  const lane = FX.map((f, i) => `<div style="display:grid;grid-template-columns:130px ${lw}px;gap:12px;align-items:center;min-height:${i === 2 ? 96 : 70}px;border-bottom:1px solid var(--line);${i === 2 ? "background:rgba(241,230,211,.045);box-shadow:inset 2px 0 var(--ink)" : ""}"><button style="text-align:left;padding-left:12px" aria-pressed="${i === 2}"><span class="rowname">${f.name}</span><br><span class="lbl">${f.why.split(",")[0]}</span></button>${fxShape(f, lw, i === 2 ? 60 : 34, i === 2, 4)}</div>`).join("");
  return `<div style="display:grid;grid-template-columns:${142 + lw + 20}px minmax(0,1fr);flex:1;padding-top:12px"><div><div style="margin-left:142px">${barNumbers(lw, { gap: 4, bars: 8 })}</div>${lane}<p class="lbl" style="margin:10px 0 0 12px">All three land on the FX lane.</p></div>
    <div style="border-left:1px solid var(--line);padding:6px 0 0 24px;display:flex;flex-direction:column;gap:12px"><span class="lbl">FX lane · ${FX[2].why}</span>${presetBtn("Bright noise")}<div style="display:grid;grid-template-columns:1fr 1fr;gap:14px 8px;justify-items:center">${FX[2].k.map(([n, v, wd]) => knob(n, v, wd, n === "Tone" ? 0.55 : null, 76, C.vox)).join("")}</div><p style="margin:0">Mentor: Tone up a little.<br><span class="mute">Gold ticks mark those.</span></p><button class="ghost" style="align-self:flex-start">Suggest for riser</button></div></div>`;
}

const DIRS = [
  { drums: foldDrums, melody: foldMelody, fx: foldFx },
  { drums: twinDrums, melody: twinMelody, fx: twinFx },
  { drums: drawerDrums, melody: drawerMelody, fx: drawerFx },
];
const variants = DIRS.map((d) => () => {
  if (famOf === "bass") return shell(bassMiddle());
  if (famOf === "melody") return shell(d.melody());
  if (famOf === "fx") return shell(d.fx());
  return shell(d.drums());
});

// ---------- harness (PICKER.md wiring) ----------
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
let current = 0;
function moveHighlight() { const el = items[current]; highlight.style.width = el.offsetWidth + 'px'; highlight.style.transform = `translateX(${el.offsetLeft}px)`; }
function mount(i) { stage.innerHTML = ''; requestAnimationFrame(() => { stage.innerHTML = variants[i](); }); }
function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => { el.toggleAttribute('data-active', j === i); if (j === i) el.setAttribute('aria-current', 'true'); else el.removeAttribute('aria-current'); });
  moveHighlight();
  const url = new URL(location); url.searchParams.set('v', i + 1); history.replaceState(null, '', url);
  mount(i);
}
items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
window.addEventListener('resize', moveHighlight);
document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});
setActive((parseInt(params.get('v'), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));
</script>
</body></html>
