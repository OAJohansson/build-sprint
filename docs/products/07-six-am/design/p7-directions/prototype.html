<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Six AM · Rebuild the song · ten directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=block" rel="stylesheet">
<style>
/* Phase 7 Discover prototypes (decision 0028). Ten directions, each showing three moments:
   ?v=1..10 direction · ?m=1 Make drums choosing a sound · ?m=2 Make drums fixing by ear · ?m=3 Studio rebuild
   · &deck=0 the Deck isn't open (m=3) · &shot=1 hides the picker. Nothing plays: taps change what's on screen. */
:root { color-scheme: dark; --bg:#131110; --panel:#1a1715; --panel2:#201c19; --line:#2b2622; --line2:#3a322c; --ink:#f1e6d3; --mute:#aa9c88; --dim:#958a7a; --gold:#f2b134; --goldDim:rgba(242,177,52,.14); --bass:#ef5b37; --drums:#f2b134; --teal:#23b3a5; --lead:#7d95e0; --vox:#e08fae; --fx:#a6c35a; --mono:"IBM Plex Mono", ui-monospace, Menlo, monospace; --serif:"Instrument Serif", Georgia, serif; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.45 var(--mono); -webkit-font-smoothing: antialiased; overflow: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; text-align: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid rgba(241,230,211,.55); outline-offset: 2px; }
.app { display: grid; grid-template-rows: 52px auto minmax(0,1fr); grid-template-columns: minmax(0,1fr); height: 100vh; }
.app.studio { grid-template-rows: 56px minmax(0,1fr); }
/* app bar */
.bar { display: flex; align-items: center; gap: 24px; padding: 0 20px; border-bottom: 1px solid var(--line); min-width: 0; }
.logo { display: flex; align-items: center; gap: 10px; padding-right: 22px; border-right: 1px solid var(--line); height: 100%; flex: none; }
.logo i { width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 50% 60%, #f2b134 0 30%, #ef5b37 31% 52%, #23b3a5 53% 70%, #221d1a 71%); }
.logo b { font: italic 400 26px var(--serif); }
.nav { display: flex; gap: 20px; flex: none; }
.nav a { color: var(--mute); text-decoration: none; padding: 16px 0; }
.nav a.on { color: var(--ink); box-shadow: inset 0 -2px var(--gold); }
.gear { margin-left: auto; color: var(--mute); font-size: 16px; }

.small { color: var(--mute); font-size: 12px; }

.deck.off::before { color: var(--dim); }

.room.rail { grid-template-columns: minmax(0,1fr) 300px; }
.col { display: flex; flex-direction: column; min-height: 0; min-width: 0; padding: 0 28px; }
.side { border-left: 1px solid var(--line); background: var(--panel); min-height: 0; display: flex; flex-direction: column; }

@media (hover:hover) and (pointer:fine) { .ghost:hover { border-color: var(--dim); } }
.lbl { font-size: 11.5px; color: var(--mute); }

.knob { display: grid; justify-items: center; gap: 1px; } .knob span { font-size: 12px; } .knob small { color: var(--mute); font-size: 11.5px; }

.ruler { position: relative; display: grid; align-items: end; cursor: pointer; }
.ruler .cells { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; height: 22px; }
.ruler .rb { display: grid; grid-template-columns: repeat(16, minmax(0,1fr)); border-bottom: 1px solid var(--line2); min-width: 0; }
.ruler .rb button { font-size: 11px; color: var(--dim); padding: 0 0 3px 2px; font-variant-numeric: tabular-nums; overflow: visible; white-space: nowrap; height: 22px; display: flex; align-items: flex-end; }
@media (hover:hover) and (pointer:fine) { .ruler .rb button:hover { box-shadow: inset 0 -3px var(--mute); color: var(--ink); } }
.ruler { cursor: pointer; } .ruler .ph { top: 0; bottom: 0; }
.steps { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 6px; height: 100%; }
.barb { display: grid; grid-template-columns: repeat(16, minmax(0,1fr)); gap: 2px; min-width: 0; }

.st.a { background: var(--ink); }

.st.x { background: transparent; box-shadow: inset 0 0 0 1.5px rgba(242,177,52,.75); }
@media (hover:hover) and (pointer:fine) { .st:hover { box-shadow: inset 0 0 0 1px rgba(241,230,211,.6); } }
.muted .st.r, .muted .st.a { opacity: .3; }
.ph { position: absolute; top: -3px; bottom: -3px; width: 2px; background: #fff; pointer-events: none; border-radius: 1px; }
.legend { display: flex; gap: 14px; font-size: 11px; color: var(--mute); white-space: nowrap; }
.legend i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.mbtn { width: 26px; height: 22px; border-radius: 4px; color: var(--dim); font-size: 11px; display: grid; place-items: center; border: 1px solid transparent; flex: none; }
.mbtn[aria-pressed="true"] { background: #3a322c; color: var(--ink); }
@media (hover:hover) and (pointer:fine) { .mbtn:hover { border-color: var(--line2); color: var(--ink); } }
.hatch { background-image: repeating-linear-gradient(135deg, rgba(242,177,52,.10) 0 6px, transparent 6px 12px); }
.yours { color: var(--gold); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 11.5px; white-space: nowrap; }
.pill.gold { background: var(--goldDim); color: var(--gold); height: auto; font-weight: 400; margin: 0; }
.count { display: inline-flex; align-items: center; gap: 8px; color: var(--gold); white-space: nowrap; font-size: 12.5px; }
.count::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.count.done { color: var(--mute); } .count.done::before { background: #7fbf6a; }
/* sound items */
.snd { display: flex; flex-direction: column; gap: 1px; padding: 6px 9px; border-radius: 6px; border: 1px solid transparent; min-width: 0; }
.snd b { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12.5px; }
.snd small { color: var(--mute); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.snd[aria-pressed="true"] { border-color: var(--gold); background: var(--goldDim); }
@media (hover:hover) and (pointer:fine) { .snd:hover { border-color: var(--line2); } .snd[aria-pressed="true"]:hover { border-color: var(--gold); } }
.playing::before { content: "▶ "; color: var(--gold); font-size: 9px; }
.famh { font-size: 11px; color: var(--dim); text-transform: none; padding: 0 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pop { position: fixed; z-index: 50; background: #221d1a; border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 14px 40px rgba(0,0,0,.55); padding: 12px; }
/* studio */
.stbar { display: flex; align-items: center; gap: 18px; padding: 0 18px; border-bottom: 1px solid var(--line); min-width: 0; }
.stbar .tname { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.mo { display: flex; border: 1px solid var(--line2); border-radius: 999px; padding: 3px; flex: none; }
.mo button { padding: 0 14px; height: 30px; border-radius: 999px; color: var(--mute); white-space: nowrap; }
.mo button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.mo.big button { height: 38px; padding: 0 22px; font-size: 14px; }
.monote { font-size: 12px; color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.monote.warn { color: var(--gold); }
.monote button { text-decoration: underline; text-underline-offset: 3px; color: var(--ink); }
.tl { position: relative; min-width: 0; }
.slot { position: absolute; top: 4px; bottom: 4px; border-radius: 5px; display: flex; align-items: center; padding: 0 8px; gap: 6px; min-width: 0; overflow: hidden; font-size: 11.5px; white-space: nowrap; }
.slot.e { border: 1px dashed rgba(241,230,211,.18); color: var(--dim); }
.slot.h { border: 1px dashed rgba(242,177,52,.6); color: var(--gold); background: rgba(242,177,52,.05); }
.slot.f { color: var(--ink); }
.slot[aria-expanded="true"] { box-shadow: 0 0 0 2px var(--ink); }
@media (hover:hover) and (pointer:fine) { .slot.e:hover, .slot.h:hover { background: rgba(241,230,211,.06); } }
.slot span { overflow: hidden; text-overflow: ellipsis; }
.secband { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line2); }
.ph2 { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; pointer-events: none; z-index: 3; }
.lib { display: flex; flex-direction: column; gap: 4px; }
.part { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line); text-align: left; min-width: 0; }
.part i { width: 3px; align-self: stretch; border-radius: 2px; flex: none; }
.part div { min-width: 0; } .part b { font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .part small { color: var(--mute); font-size: 11px; }
@media (hover:hover) and (pointer:fine) { .part:hover { border-color: var(--dim); } }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
/* picker (verbatim, PICKER.md) */
.proto-picker { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 2147483647; display: flex; align-items: center; gap: 2px; padding: 4px; border-radius: 999px; background: rgba(10, 10, 10, 0.82); -webkit-backdrop-filter: blur(12px) saturate(1.4); backdrop-filter: blur(12px) saturate(1.4); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.08) inset, 0 8px 24px rgba(0, 0, 0, 0.24), 0 2px 6px rgba(0, 0, 0, 0.12); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 13px; line-height: 1; -webkit-font-smoothing: antialiased; user-select: none; -webkit-user-select: none; }
.proto-picker-highlight { position: absolute; top: 4px; left: 0; height: 28px; border-radius: 999px; background: rgba(255, 255, 255, 0.12); will-change: transform; }
.proto-picker[data-ready] .proto-picker-highlight { transition: transform 250ms cubic-bezier(0.23, 1, 0.32, 1), width 250ms cubic-bezier(0.23, 1, 0.32, 1); }
@media (prefers-reduced-motion: reduce) { .proto-picker[data-ready] .proto-picker-highlight { transition: none; } }
.proto-picker-item { position: relative; display: flex; align-items: center; height: 28px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.55); font: inherit; cursor: pointer; transition: color 150ms ease-out; }
.proto-picker-item:hover { color: rgba(255, 255, 255, 0.85); }

.proto-picker-item:focus-visible { outline: 2px solid rgba(255, 255, 255, 0.4); outline-offset: 2px; }

<div id="stage"></div>
<div class="moments" aria-label="Moment">
  <button data-m="1">1 Choose a sound</button><button data-m="2">2 Fix by ear</button><button data-m="3">3 Rebuild</button><button data-m="d">Deck closed</button>
</div>

<script>
// ───────── demo data: "Hold On (Club Mix)", Nora Vale · 124 BPM · A minor · 96 bars ─────────
const WORST = new URLSearchParams(location.search).get("data") === "worst";
const TRACK = WORST ? { title: "Hold On To Your Love (Dennis Ferrer's Unreleased Dub, 2009 Remaster)", artist: "Kerri Chandler & Jerome Sydenham", bpm: 124, key: "A minor" } : { title: "Hold On (Club Mix)", artist: "Nora Vale", bpm: 124, key: "A minor" };
const LOOP = { from: 33, bars: 4, sec: "Drop 1" };
const ROWS = [
  { id: "kick", name: "Kick", noun: "kick", read: true, sound: "Deep Round" },
  { id: "clap", name: "Claps & snares", noun: "clap", read: true, sound: "909 Clap" },
  { id: "chat", name: "Closed hat", noun: "closed hat", read: true, sound: "909 Closed" },
  { id: "ohat", name: "Open hat", noun: "open hat", read: true, sound: "909 Open" },
  { id: "shak", name: "Shaker / percussion", noun: "shaker", read: false, sound: "Egg Shaker", listen: "a shaker" },
  { id: "ride", name: "Ride", noun: "ride", read: false, sound: "909 Ride", listen: "a ride" },
];
// 20 sounds per row, by family. Kick has full lines; the others a feel word per sound.
const KICK = [
  ["909 punchy", "909 Classic", "punchy", "The house standard: a short thump with a snap on top", .55, .45],
  ["909 punchy", "909 Hard", "snappy", "More attack, cuts through a busy loop", .65, .35],
  ["909 punchy", "909 Soft", "rounded", "A 909 with the click taken off", .42, .5],
  ["808 long boom", "808 Boom", "booming", "A long low tone that hums under the bass", .2, .92],
  ["808 long boom", "808 Short", "round", "An 808 cut short, round and tidy", .27, .55],
  ["Deep house", "Deep Round", "warm", "Soft and round, the classic deep-house thud", .32, .6],
  ["Deep house", "Velvet", "soft", "A gentle kick that sits back", .24, .66],
  ["Techno", "Techno Tight", "tight", "Short and dry, punches without boom", .5, .2],
  ["Techno", "Berlin Click", "dry", "Very short with a hard edge", .62, .1],
  ["Hard", "Distorted", "gritty", "Overdriven, buzzy and loud", .76, .5],
  ["Hard", "Rave Hard", "fierce", "A hard kick for fast tracks", .83, .4],
  ["Live drum", "Live Kick", "natural", "A real drum kit's bass drum", .47, .38],
  ["Live drum", "Room Kick", "roomy", "A live kick with the room around it", .4, .76],
  ["Live drum", "Disco Kick", "loose", "A dry 70s kit kick", .52, .28],
  ["Lo-fi", "Dusty", "dusty", "Muffled, like it came off an old record", .14, .46],
  ["Lo-fi", "Tape Kick", "muffled", "Soft top, warm tape blur", .19, .34],
  ["Sub", "Sub Thump", "deep", "Mostly low end, felt more than heard", .08, .7],
  ["Sub", "Low Rumble", "heavy", "A long low rumble with a little grit", .11, .84],
  ["Clicky", "Click Top", "clicky", "A bright click that helps on small speakers", .92, .15],
  ["Clicky", "Beater", "bright", "The beater hitting the skin", .86, .24],
].map(([fam, name, feel, line, bright, long]) => ({ fam, name, feel, line, bright, long }));
const OTHER = {
  clap: [["909 clap", ["909 Clap:crisp", "909 Clap Tight:short"]], ["808 clap", ["808 Clap:soft", "808 Clap Long:airy"]], ["Big clap", ["Stack Clap:huge", "Crowd Clap:wide"]], ["Snap", ["Finger Snap:dry", "Snap Room:light"]], ["Rim", ["Rim Shot:woody", "Rim Click:tiny"]], ["Tight snare", ["Tight Snare:tight", "Garage Snare:bouncy"]], ["Roomy snare", ["Room Snare:roomy", "Hall Snare:big"]], ["Live snare", ["Live Snare:natural", "Funk Snare:crack"]], ["Lo-fi snare", ["Dusty Snare:dusty", "Tape Snare:muffled"]], ["Brush", ["Brush Sweep:soft", "Brush Tap:gentle"]]],
  chat: [["909", ["909 Closed:crisp", "909 Tick:short", "909 Dark:dull"]], ["808", ["808 Closed:soft", "808 Bright:sharp", "808 Tight:tiny"]], ["Live", ["Live Hat:natural", "Pedal Hat:chick", "Half Open:loose"]], ["Tiny tick", ["Tick:tiny", "Needle:thin", "Click Hat:dry"]], ["Lo-fi", ["Dusty Hat:dusty", "Tape Hat:muffled", "Vinyl Hat:crackly"]], ["Sizzly", ["Sizzle:bright", "Glass Hat:shiny", "Air Hat:airy"]], ["Shaker-like", ["Shaky Hat:soft", "Grain Hat:grainy"]]],
  ohat: [["909 open", ["909 Open:crisp", "909 Long:sizzly", "909 Choke:short", "909 Dark Open:dull"]], ["808 open", ["808 Open:soft", "808 Wide:airy", "808 Short Open:tidy"]], ["Short open", ["Quick Open:short", "Tss:tight", "Lift:light"]], ["Long sizzle", ["Long Sizzle:long", "Wash:washy", "Glitter:bright", "Hiss:breathy"]], ["Live", ["Live Open:natural", "Brass Open:ringing", "Loose Open:loose"]], ["Lo-fi", ["Dusty Open:dusty", "Tape Open:muffled", "Crackle Open:crackly"]]],
  shak: [["Shakers", ["Egg Shaker:soft", "Tube Shaker:crisp", "Seed Shaker:grainy", "Fast Shaker:busy"]], ["Tambourine", ["Tambourine:jingly", "Tamb Hit:bright", "Tamb Roll:shimmery"]], ["Congas & bongos", ["High Conga:warm", "Low Conga:round", "Bongo:poppy"]], ["Cowbell", ["808 Cowbell:hooky", "Live Cowbell:clanky"]], ["Clave & woodblock", ["Clave:woody", "Woodblock:hollow", "Stick:dry"]], ["Toms", ["Low Tom:deep", "High Tom:tight", "808 Tom:boomy"]], ["Hands", ["Hand Clap:loose", "Slap:dry"]]],
  ride: [["909 ride", ["909 Ride:shiny", "909 Ride Dark:dull", "909 Ride Short:short", "909 Ride Wide:wide"]], ["Live ride", ["Live Ride:natural", "Jazz Ride:loose", "Dry Ride:dry", "Big Ride:ringing"]], ["Ride bell", ["Ride Bell:bell", "Ping:pingy", "Bell Short:tight", "Bell Dark:soft"]], ["Crash & splash", ["Crash:big", "Splash:quick", "Reverse Crash:swelling", "China:trashy"]], ["Sizzle", ["Sizzle Ride:sizzly", "Rivet Ride:buzzy", "Tape Ride:muffled", "Air Ride:airy"]]],

const SOUNDS = { kick: KICK };

  for (let b = 0; b < 4; b++) {

    for (const s of [4, 12]) p.clap[b * 16 + s] = "r";
    for (const s of [0, 4, 8, 12]) p.chat[b * 16 + s] = "r";
    for (const s of [1, 5, 9, 13, 3, 7, 11, 15]) if (b % 2 || s % 4 === 3) p.chat[b * 16 + s] = "r";
    for (const s of [2, 6, 10, 14]) p.ohat[b * 16 + s] = "r";

}

  <path d="M${x0} ${y0} A${r} ${r} 0 ${a - a0 > 180 ? 1 : 0} 1 ${x1} ${y1}" fill="none" stroke="var(--drums)" stroke-width="3" stroke-linecap="round"/></svg>

function steps(id, { h = 22 } = {}) {

    return `<button data-act="row" data-row="${r.id}" style="display:flex;flex-direction:column;padding:2px 8px;border-radius:5px;${S.open === r.id ? "background:rgba(241,230,211,.07)" : ""}"><span style="white-space:nowrap">${r.name}</span><small style="font-size:11px" class="${open ? "yours" : "mute"}">${open ? "not heard · yours" : esc(S.pick[r.id])}</small></button>

D.push({ name: "Mentor", m: {
  1: () => makeRoom(`${famTabs()}${rowsTagged(24)}<div class="grow"></div>${feelPicker()}${foot()}`, mentorOpen()),
  2: () => makeRoom(`${famTabs()}${rowsTagged(34)}<div class="grow"></div><div style="display:flex;align-items:center;gap:22px;padding:10px 0;border-top:1px solid var(--line)"><span class="lbl">${ROWOF[S.open].name}</span><span class="serif">${S.pick[S.open]}</span>${knobs(50)}</div>${foot()}`, mentorOpen()),
  3: () => studioRoom(`${studioBar()}<div style="display:grid;grid-template-columns:minmax(0,1fr) 290px;min-height:0"><div style="display:flex;flex-direction:column;min-height:0">${lanesTimeline({ hint: "text", laneH: 38 })}<div class="grow"></div>${libraryDrawer(120)}</div><aside class="side">${recipe()}</aside></div>`),
}});
function rowsTagged(h) {
  return `<div style="display:grid;grid-template-columns:200px minmax(0,1fr) 58px;column-gap:12px;row-gap:6px;align-items:center;padding-top:12px"><span>${countLine()}</span>${ruler()}<span></span>
  ${ROWS.map((r) => { const open = openRows().includes(r); return `<button data-act="row" data-row="${r.id}" style="display:flex;align-items:center;gap:8px;padding:4px 8px;border-radius:5px;${S.open === r.id ? "background:rgba(241,230,211,.07)" : ""}"><span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.name}</span>${open ? `<span class="pill gold">yours</span>` : ""}</button>${steps(r.id, { h })}<span style="display:flex;gap:2px">${ms(r.id)}</span>`; }).join("")}</div>`;
}
function feelPicker() {
  const xs = SOUNDS[S.open], feels = [...new Set(xs.map((x) => x.feel))];
  const f = feels.includes(S.feel) ? S.feel : feels[0];
  return `<div style="border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:8px"><div style="display:flex;align-items:center;gap:16px"><span class="lbl">${ROWOF[S.open].name}: how should it feel?</span><span class="serif" style="font-size:20px">${S.pick[S.open]}</span><span style="margin-left:auto">${knobs(42, 14)}</span></div>
  <div style="display:flex;flex-wrap:wrap;gap:4px">${feels.map((x) => `<button class="ghost" data-act="feel" data-feel="${esc(x)}" style="${x === f ? "background:var(--ink);color:var(--bg);border-color:var(--ink)" : ""}">${esc(x)}</button>`).join("")}</div>
  <div style="display:flex;gap:6px">${xs.filter((x) => x.feel === f).map((x) => sndBtn(x, 'style="min-width:220px"', `<b class="${S.preview === x.name ? "playing" : ""}">${esc(x.name)} <span class="mute" style="font-weight:400">· ${esc(x.fam)}</span></b><small>${esc(x.line)}</small>`)).join("")}</div></div>`;
}
function mentorOpen() {
  const o = openRows();
  return `<div style="padding:18px 20px;display:flex;flex-direction:column;gap:12px;flex:1;min-height:0"><span class="lbl">Mentor, on the drums</span>
  ${o.length ? `<div style="border:1px solid rgba(242,177,52,.45);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px" role="status"><b style="font-weight:500;color:var(--gold)">${plural(o.length, "row is", "rows are")} yours to fill</b><span style="line-height:1.6">Make can't hear ${o.map((r) => r.name.toLowerCase()).join(" or ")} yet, so the loop sounds thinner than the original. Play the original, listen for them, and tap the hits in.</span><div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">${o.map((r) => `<button class="ghost" data-act="row" data-row="${r.id}">Go to ${r.name.split(" ")[0]}</button>`).join("")}<button class="lbl" data-act="dismissall" style="text-decoration:underline;text-underline-offset:3px">Leave empty</button></div></div>` : `<span class="count done">Every row filled</span>`}
  <div style="align-self:flex-end;background:#2b2622;border-radius:10px;padding:8px 12px;max-width:230px">Why does my kick sound softer?</div><p style="margin:0;line-height:1.7">The original kick is shorter and brighter. Try a 909 or Techno sound, or Length down.</p>
  <div style="margin-top:auto;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;color:var(--dim);display:flex;justify-content:space-between">Ask about the drums…<span>↑</span></div></div>`;
}
function recipe() {
  const next = SECS.find((s) => toFill(s).length);
  return `<div style="padding:16px 18px;display:flex;flex-direction:column;gap:12px;overflow:auto;flex:1;min-height:0"><span class="lbl">Mentor, on the rebuild</span>
  ${next ? `<div style="border:1px solid rgba(242,177,52,.45);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:6px"><b style="font-weight:500;color:var(--gold)">Next: ${next.n}</b><span style="line-height:1.6">The original has ${toFill(next).map((l) => l.n.toLowerCase()).join(", ")} here, still yours to fill.</span><button class="ghost" data-act="slot" data-key="${next.n}:${toFill(next)[0].id}" style="align-self:flex-start">Fill ${toFill(next)[0].n.toLowerCase()}</button></div>` : ""}
  ${SECS.map((s) => `<div style="display:flex;justify-content:space-between;gap:8px"><span>${s.n}</span><span class="lbl">${toFill(s).length ? `<span class="yours">${toFill(s).length} to fill</span>` : "done"}</span></div>`).join("")}
  <div style="margin-top:auto;border:1px solid var(--line2);border-radius:8px;padding:10px 12px;color:var(--dim);display:flex;justify-content:space-between">Ask about the song…<span>↑</span></div></div>`;
}

// 10 · Table — the 20 sounds as a sortable table with short↔long and dark↔bright bars; the Studio is a song strip with a section inspector under it.
D.push({ name: "Table", m: {
  1: () => makeRoom(`${famTabs()}${rowsStatus(22)}${soundTable()}${foot()}`),
  2: () => makeRoom(`${famTabs()}${rowsStatus(34)}<div class="grow"></div><div style="display:flex;align-items:center;gap:22px;padding:10px 0;border-top:1px solid var(--line)"><span class="lbl">${ROWOF[S.open].name}</span><span class="serif">${S.pick[S.open]}</span>${knobs(50)}</div>${foot()}`),
  3: () => studioRoom(`${studioBar()}<div style="display:flex;flex-direction:column;min-height:0">${songStrip()}${inspector()}</div>`),
}});
function rowsStatus(h) {
  return `<div style="display:grid;grid-template-columns:170px 150px minmax(0,1fr) 58px;column-gap:12px;row-gap:5px;align-items:center;padding-top:10px"><span class="lbl">Row</span><span class="lbl">State</span>${ruler()}<span></span>
  ${ROWS.map((r) => { const open = openRows().includes(r); return `<button data-act="row" data-row="${r.id}" style="white-space:nowrap;padding:3px 6px;border-radius:4px;${S.open === r.id ? "background:rgba(241,230,211,.08)" : ""}">${r.name}</button><span style="font-size:12px;white-space:nowrap" class="${open ? "yours" : "mute"}">${open ? "empty · yours to fill" : `${hitCount(r.id)} hits · ${r.read ? "heard" : "yours"}`}</span>${steps(r.id, { h })}<span style="display:flex;gap:2px">${ms(r.id)}</span>`; }).join("")}</div>
  <div style="display:flex;gap:16px;padding:6px 0 0 182px">${countLine()}${legend()}</div>`;
}
function soundTable() {
  const xs = SOUNDS[S.open];
  const bar = (v) => `<span style="display:inline-block;width:56px;height:5px;border-radius:3px;background:var(--line2);vertical-align:middle;position:relative"><i style="position:absolute;left:${v * 50}px;top:-2px;width:6px;height:9px;border-radius:2px;background:var(--mute)"></i></span>`;
  return `<div style="display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;flex:1;min-height:0;border-top:1px solid var(--line);margin-top:10px;padding-top:8px"><div style="overflow:auto;min-height:0"><table style="width:100%;border-collapse:collapse;font-size:12px"><caption class="sr">20 ${ROWOF[S.open].name} sounds</caption><thead><tr class="lbl" style="text-align:left;position:sticky;top:0;background:var(--bg)"><th style="font-weight:400;padding:4px 8px">Sound</th><th style="font-weight:400">Kind</th><th style="font-weight:400">Feel</th><th style="font-weight:400">short ↔ long</th><th style="font-weight:400">dark ↔ bright</th><th style="font-weight:400">What it is</th></tr></thead><tbody>
  ${xs.map((x) => { const on = S.pick[S.open] === x.name; return `<tr style="${on ? "background:var(--goldDim)" : ""};border-top:1px solid var(--line)"><td style="padding:0"><button data-act="snd" data-name="${esc(x.name)}" aria-pressed="${on}" style="padding:5px 8px;width:100%;white-space:nowrap" class="${S.preview === x.name ? "playing" : ""}">${esc(x.name)}</button></td><td class="mute" style="white-space:nowrap">${esc(x.fam)}</td><td>${esc(x.feel)}</td><td>${bar(x.long)}</td><td>${bar(x.bright)}</td><td class="mute" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:260px">${esc(x.line)}</td></tr>`; }).join("")}</tbody></table></div>
  <div style="display:flex;flex-direction:column;gap:12px;padding-top:4px"><span class="serif">${S.pick[S.open]}</span><div style="display:grid;grid-template-columns:repeat(2,auto);gap:10px 18px">${["pitch", "length", "tone", "drive"].map((k) => knob(k, k[0].toUpperCase() + k.slice(1), S.knobs[k], KW[k](S.knobs[k]), 50)).join("")}</div></div></div>`;
}
function songStrip() {
  const meas = LANES.filter((l) => l.m);
  return `<div style="padding:12px 18px;border-bottom:1px solid var(--line)"><div class="tl" style="height:${70 + 0}px">${SECS.map((s) => { const on = S.sec === s.n, n = toFill(s).length; return `<button data-act="sec" data-sec="${s.n}" style="position:absolute;left:${pct(s.a)}%;width:calc(${pct(s.b + 1) - pct(s.a)}% - 4px);top:0;bottom:0;border-radius:6px;padding:7px 9px;text-align:left;border:1px solid ${on ? "var(--ink)" : "var(--line)"};background:${on ? "rgba(241,230,211,.06)" : "none"};overflow:hidden"><div style="white-space:nowrap">${s.n} <span class="lbl">${s.a}–${s.b}</span></div><div style="display:flex;gap:3px;margin-top:8px">${meas.map((l) => `<i title="${l.n}" style="flex:1;height:8px;border-radius:2px;${s.has.includes(l.id) ? (S.fill[`${s.n}:${l.id}`] ? `background:${l.c}` : `box-shadow:inset 0 0 0 1px ${l.c}`) : "background:var(--line)"}"></i>`).join("")}</div><div class="lbl" style="margin-top:6px;white-space:nowrap">${n ? `<span class="yours">${n} to fill</span>` : "filled"}</div></button>`; }).join("")}<span class="ph2" style="left:${pct(S.bar)}%"></span></div>
  <div class="lbl" style="margin-top:6px">Each small bar is one part the map measures (kick, hats, bass, chords, vocals): outline = in the original, filled = yours.</div></div>`;
}
function inspector() {
  const s = SECOF[S.sec];
  return `<div style="display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;padding:14px 18px;min-height:0;overflow:auto"><div><div style="display:flex;align-items:baseline;gap:14px;margin-bottom:10px"><span class="serif" style="font-size:28px">${s.n}</span><span class="lbl">bars ${s.a}–${s.b}</span></div>
  <table style="width:100%;border-collapse:collapse"><caption class="sr">${s.n} lanes</caption><tbody>${LANES.map((l) => { const st = slotState(s, l.id), key = `${s.n}:${l.id}`; return `<tr style="border-top:1px solid var(--line)"><td style="padding:6px 0;width:130px;box-shadow:inset 3px 0 ${l.c};padding-left:10px">${l.n}</td><td class="lbl" style="width:230px">${hasHint(s, l.id) ? `<span class="yours">in the original</span>` : l.m ? "not in the original" : "no hint"}</td><td><button data-act="slot" data-key="${key}" aria-expanded="${S.pop === key}" class="ghost" style="${st === "f" ? `background:color-mix(in srgb, ${l.c} 28%, #1a1715);border-color:transparent` : st === "h" ? "border-style:dashed;border-color:rgba(242,177,52,.6);color:var(--gold)" : "border-style:dashed;color:var(--dim)"};${S.pop === key ? "box-shadow:0 0 0 2px var(--ink)" : ""}">${st === "f" ? esc(S.fill[key]) : "Fill…"}</button></td></tr>`; }).join("")}</tbody></table></div>
  <aside style="display:flex;flex-direction:column;gap:8px"><span>My saved parts</span><span class="lbl">${S.pop ? S.pop.replace(":", " · ") : "Pick Fill… on a lane"}</span>${partsList(S.pop?.split(":")[1])}</aside></div>`;
}

// ───────── render + events ─────────
const stage = document.getElementById("stage");
let V = 0;
function render() {
  const m = M === "d" ? "3" : M;
  stage.innerHTML = D[V].m[m]() + (m === "3" && [0, 2, 7, 8].includes(V) ? slotPop() : "");
  // anchor the slot popover under its slot
  const pop = document.getElementById("pop");
  if (pop && S.pop) {
    const el = stage.querySelector(`[data-key="${S.pop}"]`);
    if (el) { const r = el.getBoundingClientRect(); const left = Math.min(Math.max(8, r.left), innerWidth - 310); const top = r.bottom + 6 + 300 > innerHeight ? Math.max(8, r.top - 6 - pop.offsetHeight) : r.bottom + 6; pop.style.left = left + "px"; pop.style.top = top + "px"; }
  }
  document.querySelectorAll(".moments button").forEach((b) => b.toggleAttribute("data-active", b.dataset.m === M));
}
stage.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act, row = t.dataset.row;
  if (a === "step") { const p = S.pat[row], i = +t.dataset.i, v = p[i]; if (v === "r") p[i] = "x"; else if (v === "x") p[i] = "r"; else if (v === "a") delete p[i]; else p[i] = "a"; }
  else if (a === "row") { S.open = row; S.fam = famsOf(row)[0]; S.feel = SOUNDS[row][0].feel; }
  else if (a === "snd") { S.pick[S.open] = t.dataset.name; S.preview = t.dataset.name; const x = SOUNDS[S.open].find((y) => y.name === t.dataset.name); if (x) { S.fam = x.fam; S.feel = x.feel; } }
  else if (a === "browse") S.browse = !S.browse;
  else if (a === "mute") S.mute[row] = !S.mute[row];
  else if (a === "solo") S.solo[row] = !S.solo[row];
  else if (a === "dismiss") S.dismissed[row] = true;
  else if (a === "dismissall") openRows().forEach((r) => (S.dismissed[r.id] = true));
  else if (a === "jump") S.play = +t.dataset.i;
  else if (a === "knob") { const k = t.dataset.k; S.knobs[k] = +((S.knobs[k] + 0.2) % 1.05).toFixed(2); }
  else if (a === "fam") S.fam = S.fam === t.dataset.fam && V === 5 ? "" : t.dataset.fam;
  else if (a === "feel") S.feel = t.dataset.feel;
  else if (a === "page") S.page = +t.dataset.b;
  else if (a === "wheel") { const xs = SOUNDS[S.open], i = xs.findIndex((x) => x.name === S.pick[S.open]); const n = xs[(i + +t.dataset.d + 20) % 20]; S.pick[S.open] = n.name; S.preview = n.name; }
  else if (a === "slot") S.pop = S.pop === t.dataset.key ? null : t.dataset.key;
  else if (a === "fill") { if (S.pop) { S.fill[S.pop] = t.dataset.part; S.pop = null; } }
  else if (a === "clear") { delete S.fill[S.pop]; S.pop = null; }
  else if (a === "closepop") S.pop = null;
  else if (a === "mo") { if (S.deck) S.mo = t.dataset.v; }
  else if (a === "deck") S.deck = true;
  else if (a === "seek") S.bar = +t.dataset.bar;
  else if (a === "sec") S.sec = t.dataset.sec;
  else return;
  render();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (S.pop || S.browse)) { S.pop = null; S.browse = false; render(); } });

// picker
const picker = document.querySelector(".proto-picker"), hl = picker.querySelector(".proto-picker-highlight");
D.forEach((d, i) => { const b = document.createElement("button"); b.className = "proto-picker-item"; b.textContent = `${i + 1} ${d.name}`; b.onclick = () => setActive(i); picker.appendChild(b); });
const items = [...picker.querySelectorAll(".proto-picker-item")];
function moveHighlight() { const el = items[V]; hl.style.width = el.offsetWidth + "px"; hl.style.transform = `translateX(${el.offsetLeft}px)`; }
function setActive(i) {
  if (i < 0 || i >= D.length) return;
  V = i; reset();
  items.forEach((el, j) => { el.toggleAttribute("data-active", j === i); if (j === i) el.setAttribute("aria-current", "true"); else el.removeAttribute("aria-current"); });
  moveHighlight();
  const url = new URL(location); url.searchParams.set("v", i + 1); url.searchParams.set("m", M); history.replaceState(null, "", url);
  render();
}
document.querySelectorAll(".moments button").forEach((b) => b.onclick = () => { M = b.dataset.m; setActive(V); });
addEventListener("resize", () => { moveHighlight(); render(); });
document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key === "0" ? 10 : parseInt(e.key, 10);
  if (k >= 1 && k <= D.length) setActive(k - 1);
  else if (e.key === "ArrowRight") setActive((V + 1) % D.length);
  else if (e.key === "ArrowLeft") setActive((V - 1 + D.length) % D.length);
  else if (e.key === "r" || e.key === "R") setActive(V);
});
if (params.get("deck") === "0") M = "d";
setActive((parseInt(params.get("v"), 10) || 1) - 1);
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));
</script>
</body></html>
