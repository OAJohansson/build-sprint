  else if (a === "slot") { S.pop = S.pop === t.dataset.key ? null : t.dataset.key; }
  else if (a === "fill") { if (S.pop) { S.fill[S.pop] = t.dataset.part; delete S.left[S.pop]; S.pop = null; } }
  else if (a === "clear") { delete S.fill[S.pop]; S.pop = null; }
  else if (a === "leaveslot") { S.left[S.pop] = true; }
  else if (a === "unleaveslot") { delete S.left[S.pop]; }
  else if (a === "closepop") S.pop = null;
  else if (a === "mo") { if (S.deck) S.mo = t.dataset.v; }
  else if (a === "deck") S.deck = true;
  else if (a === "seek") S.bar = +t.dataset.bar;
  else return;
  render();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (S.pop || S.credits)) { S.pop = null; S.credits = false; render(); } });
document.querySelectorAll(".moments button").forEach((b) => b.onclick = () => {
  M = b.dataset.m; DECK0 = false; reset(); const url = new URL(location); url.searchParams.set("m", M); url.searchParams.delete("deck"); history.replaceState(null, "", url); render();
});
addEventListener("resize", render);
render();
