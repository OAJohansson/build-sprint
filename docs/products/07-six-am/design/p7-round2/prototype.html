  <div style="overflow:auto;padding:4px 8px 12px;flex:1;min-height:0;overscroll-behavior:contain">${FAMILIES[S.open].map((f) => `<div class="famh" style="padding:12px 9px 3px">${esc(famLabel(f))}</div>${xs.filter((x) => x.fam === f).map((x) => sndBtn(x, 'style="width:100%;gap:1px"', `<b class="${S.preview === x.id ? "playing" : ""}">${esc(x.name)} <span class="mute" style="font-weight:400">· ${esc(x.feel)}</span></b><small class="clamp2" style="line-height:1.4">${esc(x.about)}</small>`)).join("")}`).join("")}</div>
  <div style="padding:9px 14px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:8px"><span class="lbl">Drums are all CC0</span>${creditsLink()}</div>`;
}
function lanesMatrix() {
  // one header per section: its name, bars and what the original has there (● yours, ○ to fill, – left empty); lanes below
  const laneW = 140, meas = ["kick", "hats", "bass", "chords", "vocals"], hh = 46 + Math.max(...SECS.map((x) => x.has.length)) * 15, laneH = tight() ? 31 : 36;
  const head = `<div style="display:grid;grid-template-columns:${laneW}px minmax(0,1fr);border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:4"><div class="lbl" style="padding:8px 14px;line-height:1.5">The original has<br><span class="dim">○ to fill<br>● yours<br>· not yet</span></div>
  <div class="tl" style="height:${hh}px">${SECS.map((s) => { const n = toFill(s).length, nar = secPx(s, innerWidth - 390) < 84; return `<button data-act="seek" data-bar="${s.a}" title="${esc(s.n)}, bars ${s.a}–${s.b}. Play from bar ${s.a}" style="position:absolute;left:${pct(s.a)}%;width:${pct(s.b + 1) - pct(s.a)}%;top:0;bottom:0;padding:7px 8px;border-left:1px solid var(--line2);overflow:hidden;text-align:left;display:flex;flex-direction:column;justify-content:flex-start"><span style="display:flex;gap:6px;align-items:baseline;min-width:0"><span class="ell">${esc(s.n)}</span>${nar ? "" : `<span class="lbl" style="flex:none">${s.a}–${s.b}</span>`}</span><span class="lbl" style="display:block;white-space:nowrap">${n ? `<span class="yours">${n}${nar ? "" : " to fill"}</span>` : nar ? "0" : "0 to fill"}</span>
  ${s.has.map((h) => { const k = `${s.n}:${h}`, f = S.fill[k], l = S.left[k]; return `<span style="display:block;font-size:11px;line-height:15px;white-space:nowrap;color:${f ? "var(--ink)" : l || h === "vocals" ? "var(--dim)" : "var(--gold)"}">${f ? "●" : l ? "–" : h === "vocals" ? "·" : "○"}${nar ? "" : " " + h}</span>`; }).join("")}</button>`; }).join("")}<span class="ph2" style="left:${pct(S.bar)}%"></span></div></div>`;
  const rows = LANES.map((l) => `<div style="display:grid;grid-template-columns:${laneW}px minmax(0,1fr);border-bottom:1px solid var(--line);height:${laneH}px">
    <div style="display:flex;align-items:center;gap:8px;padding:0 10px 0 14px;box-shadow:inset 3px 0 ${l.c}"><span style="flex:1;white-space:nowrap">${l.n}</span><span class="mbtn" aria-hidden="true">M</span></div>
    <div class="tl">${SECS.map((s) => `<span class="secband" style="left:${pct(s.a)}%;width:${pct(s.b + 1) - pct(s.a)}%;border-left-color:var(--line)"></span>`).join("")}
    ${SECS.map((s) => { const st = slotState(s, l.id), key = `${s.n}:${l.id}`, L = l; return `<button class="slot ${st}" data-act="slot" data-key="${key}" aria-expanded="${S.pop === key}" aria-label="${esc(s.n)}, ${l.n}: ${slotText(st, key) || "empty"}" title="${st === "f" ? esc(S.fill[key]) : ""}" style="left:calc(${pct(s.a)}% + 3px);width:calc(${pct(s.b + 1) - pct(s.a)}% - 6px);${st === "f" ? fillBg(L) + `box-shadow:inset 3px 0 ${L.c};` : ""}${st === "v" ? "border-color:rgba(224,143,174,.35);color:var(--dim);background:none;" : ""}"><span>${secPx(s, innerWidth - 390) < 84 ? "" : slotText(st, key, true) || (S.pop === key ? "" : "+")}</span></button>`; }).join("")}
    <span class="ph2" style="left:${pct(S.bar)}%"></span></div></div>`).join("");
  return head + rows;
}

// 10 · Table — plain rows and columns: a State column per drum row, the 20 sounds as a sortable table with their dials; the Studio as a song strip plus a section inspector.
D.push({ n: 10, slug: "table", name: "Table", m: {
  make: () => makeRoom(`${rowsTable(M === "2" ? 44 : 22)}${M === "2" ? `<div class="grow"></div>${tableLine()}` : soundTable()}${foot()}`),
  studio: () => `<div class="app studio">${studioBar()}${emptyNote()}<div style="display:flex;flex-direction:column;min-height:0">${songStrip()}${inspector()}</div></div>`,
}});
function rowsTable(h) {
  return `<div style="display:grid;grid-template-columns:170px 260px minmax(0,1fr) 58px;column-gap:12px;row-gap:5px;align-items:center;padding-top:10px"><span class="lbl">Row</span><span class="lbl">State</span>${ruler()}<span></span>
  ${ROWS.map((r) => { const st = rowState(r), on = S.open === r.id;
    return `<button data-act="row" data-row="${r.id}" aria-pressed="${on}" class="ell" style="padding:3px 6px;border-radius:4px;${on ? "background:rgba(241,230,211,.08)" : ""}">${r.name}</button>
    <span style="font-size:12px;white-space:nowrap" class="${st === "open" ? "yours" : "mute"}">${st === "open" ? `Empty: yours to fill · ${leave(r.id)}` : st === "left" ? `Left empty · ${undo(r.id)}` : `${plural(hitCount(r.id), "hit", "hits")} · ${st === "heard" ? "Make heard them" : "you tapped them in"}`}</span>
    <div style="position:relative" class="${st === "open" ? "hatch" : ""}">${steps(r.id, h)}${st === "open" ? `<div class="over"><span>listen for ${r.listen} and tap it in</span></div>` : ""}</div><span style="display:flex;gap:2px">${ms(r.id)}</span>`; }).join("")}</div>
  <div style="display:flex;gap:16px;align-items:baseline;padding:7px 0 0 0;min-width:0">${countLine()}<span class="lbl ell" title="${WHY}">${openRows().length ? "Make can’t hear shakers or rides yet; some of their hits may have landed on Closed hat." : ""}</span><span style="margin-left:auto">${legend()}</span></div>`;
}
function soundTable() {
  const keyf = { kind: (s) => FAMILIES[s.row].indexOf(s.fam), sound: (s) => s.name, long: (s) => s.len, bright: (s) => s.hz }[S.sort];
  const xs = [...SOUNDS[S.open]].sort((a, b) => (keyf(a) < keyf(b) ? -1 : keyf(a) > keyf(b) ? 1 : 0));
  const dial = (v) => `<span class="dial" aria-hidden="true"><i style="left:${(v * 100).toFixed(1)}%"></i></span>`;
  const th = (k, label, w) => `<th scope="col" style="${w ? `width:${w}px;` : ""}padding:5px 8px" aria-sort="${S.sort === k ? "ascending" : "none"}"><button data-act="sort" data-k="${k}" class="lbl" style="white-space:nowrap;${S.sort === k ? "color:var(--ink)" : ""}">${label}${S.sort === k ? " ↓" : ""}</button></th>`;
  const x = cur();
  return `<div style="display:grid;grid-template-columns:minmax(0,1fr) 250px;grid-template-rows:minmax(0,1fr);gap:22px;flex:1;min-height:0;border-top:1px solid var(--line);margin-top:10px"><div style="overflow:auto;min-height:0;overscroll-behavior:contain"><table style="width:100%;table-layout:fixed;font-size:12px"><caption class="sr">The 20 ${ROWOF[S.open].name} sounds</caption><thead style="position:sticky;top:0;background:var(--bg);z-index:1"><tr>${th("sound", "Sound", 150)}${th("kind", "Kind", 170)}<th scope="col" class="lbl" style="width:84px">Feel</th>${th("long", "short ↔ long", 104)}${th("bright", "dark ↔ bright", 112)}<th scope="col" class="lbl" style="padding-left:8px">What it is</th></tr></thead><tbody>
  ${xs.map((s) => { const on = S.pick[S.open] === s.id; return `<tr aria-selected="${on}" style="${on ? "background:var(--goldDim)" : ""};border-top:1px solid var(--line)"><td style="padding:0"><button data-act="snd" data-id="${s.id}" aria-pressed="${on}" class="ell ${S.preview === s.id ? "playing" : ""}" style="padding:${tight() ? 3 : 5}px 8px;width:100%;display:block">${esc(s.name)}</button></td><td class="mute ell" style="padding:0 8px">${esc(famLabel(s.fam))}</td><td class="ell">${esc(s.feel)}</td><td style="padding:0 8px">${dial(longness(s))}</td><td style="padding:0 8px">${dial(bright(s))}</td><td class="mute ell" style="padding:0 8px" title="${esc(s.about)}">${esc(s.about)}</td></tr>`; }).join("")}</tbody></table></div>
  <div style="display:flex;flex-direction:column;gap:10px;padding-top:10px;min-width:0;min-height:0;overflow:hidden"><span class="serif">${esc(x.name)}</span><span class="lbl">${esc(famLabel(x.fam))} · ${esc(x.feel)}</span><span class="lbl clamp2" style="color:var(--ink);opacity:.8;-webkit-line-clamp:3">${esc(x.about)}</span>
  <div class="knobs" style="gap:14px">${["pitch", "length", "tone", "drive"].map((k) => knob(k, S.knobs[k], 44)).join("")}</div><span style="margin-top:auto;padding-bottom:8px">${creditsLink()}</span></div></div>`;
}
function tableLine() {
  const r = ROWOF[S.open], x = cur();
  return `<div style="display:flex;align-items:center;gap:22px;padding:10px 0;border-top:1px solid var(--line);min-width:0"><span class="lbl" style="flex:none">${r.name}</span><span class="serif" style="flex:none">${esc(x.name)}</span><span class="lbl ell" style="flex:1">${esc(x.about)}</span>${knobs(46)}<button class="ghost" data-act="noop">All 20 sounds</button></div>`;
}
function songStrip() {
  const meas = ["kick", "hats", "bass", "chords", "vocals"];
  return `<div style="padding:12px 18px 10px;border-bottom:1px solid var(--line)"><div class="tl" style="height:${tight() ? 66 : 74}px">${SECS.map((s) => { const on = S.sec === s.n, n = toFill(s).length, nar = secPx(s, innerWidth - 36) < 110;
    return `<button data-act="sec" data-sec="${esc(s.n)}" aria-pressed="${on}" title="${esc(s.n)}, bars ${s.a}–${s.b}" style="position:absolute;left:${pct(s.a)}%;width:calc(${pct(s.b + 1) - pct(s.a)}% - 4px);top:0;bottom:0;border-radius:6px;padding:7px 9px;text-align:left;border:1px solid ${on ? "var(--ink)" : "var(--line)"};background:${on ? "rgba(241,230,211,.06)" : "none"};overflow:hidden"><span style="display:flex;gap:6px;align-items:baseline;min-width:0"><span class="ell">${esc(s.n)}</span>${nar ? "" : `<span class="lbl" style="flex:none">${s.a}–${s.b}</span>`}</span>
    <span style="display:flex;gap:3px;margin-top:8px" aria-hidden="true">${meas.map((h) => { const k = `${s.n}:${h}`, L = LANEOF[h]; return `<i style="flex:1;height:8px;border-radius:2px;${s.has.includes(h) ? (S.fill[k] ? `background:${L.c}` : S.left[k] || h === "vocals" ? `box-shadow:inset 0 0 0 1px var(--line2)` : `box-shadow:inset 0 0 0 1px ${L.c}`) : "background:var(--line)"}"></i>`; }).join("")}</span>
    <span class="lbl" style="display:block;margin-top:6px;white-space:nowrap">${n ? `<span class="yours">${n}${nar ? "" : " to fill"}</span>` : nar ? "0" : "0 to fill"}</span></button>`; }).join("")}<span class="ph2" style="left:${pct(S.bar)}%"></span></div>
  <div class="lbl" style="margin-top:7px">Small bars, left to right: kick, hats, bass, chords, vocals. Outline: the original has it, yours to fill. Filled: yours. Dark: not in the original.</div></div>`;
}
function inspector() {
  const s = SECOF[S.sec];
  const row = (l) => { const st = slotState(s, l.id), key = `${s.n}:${l.id}`;
    const orig = l.id === "vocals" && hasHint(s, l.id) ? `<span class="mute">has vocals (Make can’t yet)</span>` : hasHint(s, l.id) ? `<span class="yours">has ${l.n.toLowerCase()}</span>` : l.m ? `<span class="dim">none here</span>` : "";
    const yours = st === "f" ? `<button class="ghost" data-act="slot" data-key="${key}" aria-expanded="${S.pop === key}" style="${fillBg(l)}border-color:transparent;max-width:100%"><span class="ell">${esc(S.fill[key])}</span></button>`
      : st === "l" ? `<span class="lbl">left empty · <button class="link" data-act="unleave" data-key="${key}">Undo</button></span>`
      : st === "v" ? "" : `<button class="ghost" data-act="slot" data-key="${key}" aria-expanded="${S.pop === key}" style="border-style:dashed;${st === "h" ? "border-color:var(--goldLine);color:var(--gold)" : "color:var(--dim)"}">${st === "h" ? "Fill…" : "Add…"}</button>${st === "h" ? ` <button class="lbl link" data-act="leave" data-key="${key}" style="margin-left:10px">Leave empty</button>` : ""}`;
    return `<tr style="border-top:1px solid var(--line);height:${tight() ? 32 : 36}px"><th scope="row" style="width:130px;box-shadow:inset 3px 0 ${l.c};padding-left:12px;font-weight:400">${l.n}</th><td style="width:240px;font-size:12px">${orig}</td><td>${yours}</td></tr>`; };
  return `<div style="display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:24px;padding:12px 18px;min-height:0;overflow:auto"><div style="min-width:0"><div style="display:flex;align-items:baseline;gap:14px;margin-bottom:8px;min-width:0"><span class="serif ell" style="font-size:28px">${esc(s.n)}</span><span class="lbl" style="flex:none">bars ${s.a}–${s.b} · ${toFill(s).length ? `<span class="yours">${toFill(s).length} to fill</span>` : "0 to fill"}</span></div>
  <table style="width:100%;table-layout:fixed"><caption class="sr">${esc(s.n)}: what the original has and what is yours, per lane</caption><thead><tr class="lbl"><th scope="col" style="padding:0 0 4px 12px;width:130px">Lane</th><th scope="col" style="width:240px">The original</th><th scope="col">Yours</th></tr></thead><tbody>${LANES.map(row).join("")}</tbody></table>
  <p class="lbl" style="margin:8px 0 0">The original column is blank where Six AM doesn’t measure the part yet.</p></div>
  <aside style="min-height:0">${slotDetail()}</aside></div>`;
}

// ───────── render + events ─────────
const stage = document.getElementById("stage");
let V = 0;
function render() {
  const d = D[V], studio = ["3", "e", "d"].includes(M);
  stage.innerHTML = (studio ? d.m.studio() : d.m.make()) + (studio ? "" : creditsPop());
  const pop = document.getElementById("cpop"), btn = document.getElementById("creditsBtn");
  if (pop && btn) { const r = btn.getBoundingClientRect(); const w = pop.offsetWidth, h = pop.offsetHeight; pop.style.left = Math.min(Math.max(8, r.left), innerWidth - w - 8) + "px"; pop.style.top = (r.top - h - 8 > 8 ? r.top - h - 8 : r.bottom + 8) + "px"; }
  document.querySelectorAll(".moments button").forEach((b) => b.toggleAttribute("data-active", b.dataset.m === M));
}
stage.addEventListener("click", (e) => {
  const t = e.target.closest("[data-act]"); if (!t) return;
  const a = t.dataset.act, row = t.dataset.row;
  if (a === "step") { const p = S.pat[row], i = +t.dataset.i, v = p[i]; if (v === "r") p[i] = "x"; else if (v === "x") p[i] = "r"; else if (v === "a") delete p[i]; else p[i] = "a"; }
  else if (a === "row") { S.open = row; S.preview = null; }
  else if (a === "snd") { S.pick[S.open] = t.dataset.id; S.preview = t.dataset.id; }
  else if (a === "shelf") S.shelf = !S.shelf;
  else if (a === "credits") S.credits = !S.credits;
  else if (a === "sort") S.sort = t.dataset.k;
  else if (a === "mute") S.mute[row] = !S.mute[row];
  else if (a === "solo") S.solo[row] = !S.solo[row];
  else if (a === "dismiss") S.dismissed[row] = true;
  else if (a === "undismiss") delete S.dismissed[row];
  else if (a === "jump") S.play = +t.dataset.i;
  else if (a === "knob") { const k = t.dataset.k; S.knobs[k] = +((S.knobs[k] + 0.2) % 1.05).toFixed(2); }
  else if (a === "slot") { S.pop = S.pop === t.dataset.key ? null : t.dataset.key; }
  else if (a === "fill") { if (S.pop) { S.fill[S.pop] = t.dataset.part; delete S.left[S.pop]; S.pop = null; } }
  else if (a === "clear") { delete S.fill[S.pop]; S.pop = null; }
  else if (a === "leaveslot") { S.left[S.pop] = true; }
  else if (a === "unleaveslot") { delete S.left[S.pop]; }
  else if (a === "leave") { S.left[t.dataset.key] = true; }
  else if (a === "unleave") { delete S.left[t.dataset.key]; }
  else if (a === "closepop") S.pop = null;
  else if (a === "mo") { if (S.deck) S.mo = t.dataset.v; }
  else if (a === "deck") S.deck = true;
  else if (a === "seek") S.bar = +t.dataset.bar;
  else if (a === "sec") { S.sec = t.dataset.sec; S.pop = null; }
  else return;
  render();
});
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && (S.pop || S.credits)) { S.pop = null; S.credits = false; render(); } });

// picker
const picker = document.querySelector(".proto-picker"), hl = picker.querySelector(".proto-picker-highlight");
D.forEach((d, i) => { const b = document.createElement("button"); b.className = "proto-picker-item"; b.textContent = `${d.n} ${d.name}`; b.onclick = () => setActive(i); picker.appendChild(b); });
const items = [...picker.querySelectorAll(".proto-picker-item")];
function moveHighlight() { const el = items[V]; hl.style.width = el.offsetWidth + "px"; hl.style.transform = `translateX(${el.offsetLeft}px)`; }
function setActive(i) {
  if (i < 0 || i >= D.length) return;
  V = i; reset();
  items.forEach((el, j) => { el.toggleAttribute("data-active", j === i); if (j === i) el.setAttribute("aria-current", "true"); else el.removeAttribute("aria-current"); });
  moveHighlight();
  const url = new URL(location); url.searchParams.set("v", D[i].n); url.searchParams.set("m", M); url.searchParams.delete("deck"); history.replaceState(null, "", url);
  render();
}
document.querySelectorAll(".moments button").forEach((b) => b.onclick = () => { M = b.dataset.m; setActive(V); });
addEventListener("resize", () => { moveHighlight(); render(); });
document.addEventListener("keydown", (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = parseInt(e.key, 10);
  if (k >= 1 && k <= D.length) setActive(k - 1);
  else if (e.key === "ArrowRight") setActive((V + 1) % D.length);
  else if (e.key === "ArrowLeft") setActive((V - 1 + D.length) % D.length);
});
setActive(Math.max(0, D.findIndex((d) => d.n === (parseInt(params.get("v"), 10) || 2))));
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));
</script>
</body></html>
