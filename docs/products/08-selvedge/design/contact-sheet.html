<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Selvedge contact sheet</title>
<!-- Ten rough directions for the board screen (laptop, 1440 x 900), same content in each:
     season title and switcher, the Summer 2026 saves, the palette, one piece selected for editing.
     The photos in board/ are the owner's saves and stay out of git (see .gitignore). -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;700&family=Caveat:wght@500;700&family=DM+Serif+Display&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300;9..144,800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#161513;color:#e9e5dc;font:14px/1.45 Inter,system-ui,sans-serif;padding:36px 36px 80px}
.head{max-width:1400px;margin:0 auto 28px}.head h1{font:500 22px Inter}.head p{color:#9a958b;max-width:720px;margin-top:6px}
.grid{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:repeat(2,1fr);gap:36px 28px}
.thumb{position:relative;width:100%;aspect-ratio:1440/900;overflow:hidden;border-radius:6px;outline:1px solid #2c2a26;cursor:zoom-in}
.frame{position:absolute;top:0;left:0;width:1440px;height:900px;overflow:hidden;transform-origin:0 0}
.cap{display:flex;gap:12px;margin-top:10px;align-items:baseline}.cap b{font:500 13px 'IBM Plex Mono';color:#9a958b}.cap span{color:#9a958b}
.overlay{position:fixed;inset:0;background:rgba(10,10,10,.93);display:none;align-items:center;justify-content:center;z-index:9;cursor:zoom-out}.overlay.on{display:flex}
.holder{position:relative;overflow:hidden;border-radius:6px}
@media (max-width:900px){.grid{grid-template-columns:1fr}}

/* shared pieces */
.frame img{display:block;object-fit:cover}
.sw{display:flex;gap:10px}.sw i{display:block;width:44px;height:44px}
.pick{outline:2px solid var(--sel,#1d1b19);outline-offset:4px;position:relative}
.tools{position:absolute;display:flex;gap:6px;font:500 13px Inter}.tools span{padding:4px 9px;border-radius:6px;background:var(--toolbg,#1d1b19);color:var(--toolfg,#fff)}

/* 01 Sketchbook scroll */
.d1{background:#f3ecdf;color:#1f2a44;font-family:Inter}
.d1 .top{position:absolute;left:96px;top:56px}.d1 h2{font:800 96px/0.95 Fraunces;letter-spacing:-2px}
.d1 .seasons{font:300 15px Fraunces;margin-top:14px;display:flex;gap:18px;opacity:.75}.d1 .seasons u{text-decoration-thickness:1px;text-underline-offset:5px;opacity:1}
.d1 .col{position:absolute;left:560px;top:0;width:420px;display:flex;flex-direction:column;gap:40px;padding-top:60px}
.d1 .col img{width:420px;height:520px}.d1 .col p{font:300 13px Fraunces;margin-top:8px}
.d1 .sw{position:absolute;left:96px;bottom:72px;flex-direction:column;gap:0}.d1 .sw i{width:120px;height:40px}
.d1 .side{position:absolute;right:96px;top:60px;width:260px;display:grid;gap:14px}.d1 .side img{width:260px;height:180px}

/* 02 Contact sheet */
.d2{background:#121212;color:#d9d6cf;font-family:'IBM Plex Mono'}
.d2 .top{display:flex;justify-content:space-between;padding:30px 48px;font-size:14px;letter-spacing:1px}
.d2 .top b{font-weight:500;color:#fff}.d2 .gr{display:grid;grid-template-columns:repeat(7,1fr);gap:14px 12px;padding:0 48px}
.d2 .cell{position:relative}.d2 .cell img{width:100%;height:230px;filter:grayscale(.15)}
.d2 .cell em{font-style:normal;font-size:11px;color:#8b877f;display:block;margin-top:4px}
.d2 .ring{position:absolute;inset:-8px;border:3px solid #d93b2b;border-radius:50%/42%;transform:rotate(-4deg)}
.d2 .sw{position:absolute;left:48px;bottom:30px}.d2 .sw i{width:60px;height:22px}

/* 03 Clothes rail */
.d3{background:#5a4632;color:#efe4d0;font-family:'Barlow Condensed'}
.d3 .top{padding:36px 64px;display:flex;align-items:baseline;gap:28px}.d3 h2{font:700 64px 'Barlow Condensed';letter-spacing:1px;text-transform:uppercase}
.d3 .top span{font-size:20px;opacity:.7}.d3 .rail{position:absolute;top:210px;left:40px;right:40px;height:6px;background:#2d2218;border-radius:3px}
.d3 .hang{position:absolute;top:213px;display:flex;flex-direction:column;align-items:center}
.d3 .hook{width:2px;height:34px;background:#2d2218}.d3 .hang img{border:6px solid #efe4d0}
.d3 .sw{position:absolute;left:64px;bottom:44px}.d3 .sw i{border-radius:50%;width:38px;height:38px;border:3px solid #efe4d0}

/* 04 Tailor's pattern paper */
.d4{background:#c9a878;color:#3b2a1a;font-family:Caveat;background-image:linear-gradient(#b8955f55 1px,transparent 1px),linear-gradient(90deg,#b8955f55 1px,transparent 1px);background-size:40px 40px}
.d4 h2{position:absolute;left:70px;top:44px;font:700 72px Caveat}.d4 .meta{position:absolute;left:74px;top:132px;font:500 26px Caveat}
.d4 .piece{position:absolute;padding:10px;border:2px dashed #3b2a1a}.d4 .piece img{filter:sepia(.55) contrast(1.05)}
.d4 .piece b{position:absolute;bottom:-34px;left:4px;font:700 24px Caveat}
.d4 .sw{position:absolute;right:70px;top:60px;flex-direction:column}.d4 .sw i{width:70px;height:26px;border:2px dashed #3b2a1a}

/* 05 Designer's sketchbook */
.d5{background:#f6f1e7;color:#2b241f;font-family:Inter}
.d5 .top{position:absolute;left:72px;top:48px}.d5 h2{font:400 64px 'Instrument Serif';letter-spacing:-1px}.d5 h2 i{font-style:italic}
.d5 .tabs{display:flex;gap:16px;margin-top:6px;font-size:14px;color:#8a7f73}.d5 .tabs b{color:#2b241f;font-weight:500;border-bottom:1px solid}
.d5 .tp{position:absolute;box-shadow:0 1px 0 #00000012}.d5 .tp::before{content:'';position:absolute;top:-12px;left:50%;width:84px;height:24px;margin-left:-42px;background:#d9c9a8b3;transform:rotate(-3deg)}
.d5 .note{position:absolute;font:500 26px Caveat;color:#5b4a3c}
.d5 .daubs{position:absolute;left:72px;bottom:64px;display:flex;gap:14px}.d5 .daubs i{display:block;width:64px;height:52px;border-radius:52% 48% 55% 45%/50% 60% 40% 50%;opacity:.88}

/* 06 Museum wall */
.d6{background:#fbfaf7;color:#1b1b1a;font-family:Inter}
.d6 .plac{position:absolute;left:80px;top:80px;width:260px}.d6 .plac h2{font:400 40px 'DM Serif Display';line-height:1.05}
.d6 .plac p{font-size:13px;color:#6f6c66;margin-top:14px;line-height:1.6}.d6 .plac .sw{margin-top:28px}.d6 .plac .sw i{width:28px;height:28px}
.d6 .work{position:absolute}.d6 .work img{box-shadow:0 0 0 1px #00000014}.d6 .work p{font-size:11px;color:#6f6c66;margin-top:10px;letter-spacing:.2px}
.d6 .nav{position:absolute;right:80px;top:84px;font-size:13px;color:#6f6c66;display:flex;gap:22px}.d6 .nav b{color:#1b1b1a;font-weight:500}

/* 07 Care label */
.d7{background:#ece7dd;color:#2a2622;font-family:'Barlow Condensed'}
.d7 .label{position:absolute;left:72px;top:72px;width:330px;height:756px;background:#f8f4ea;border:1px solid #d6cdbd;padding:36px 30px;outline:2px dashed #cfc3ae;outline-offset:-12px}
.d7 .label h2{font:700 44px 'Barlow Condensed';letter-spacing:3px;text-transform:uppercase;text-align:center}
.d7 .label .r{display:flex;justify-content:space-between;border-top:1px solid #d6cdbd;padding:10px 0;font-size:18px;letter-spacing:1px;text-transform:uppercase}
.d7 .label .sw{justify-content:center;margin:18px 0}.d7 .label .sw i{width:34px;height:34px;border-radius:50%}
.d7 .gr{position:absolute;left:450px;top:72px;right:72px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.d7 .gr img{width:100%;height:370px}

/* 08 Selvedge edge */
.d8{background:#1d2733;color:#efe9dc;font-family:Inter}
.d8 .spine{position:absolute;left:430px;top:0;bottom:0;width:22px;background:#efe9dc}.d8 .spine::after{content:'';position:absolute;left:9px;top:0;bottom:0;width:4px;background:#c23a2b}
.d8 .top{position:absolute;left:72px;top:64px;width:320px}.d8 h2{font:400 58px 'Instrument Serif';line-height:1}
.d8 .top p{color:#9fb0c3;margin-top:12px;font-size:14px}.d8 .seasons{margin-top:36px;display:grid;gap:10px;font-size:15px;color:#9fb0c3}.d8 .seasons b{color:#efe9dc;font-weight:500}
.d8 .sw{position:absolute;left:72px;bottom:64px}.d8 .sw i{width:48px;height:48px;border:1px solid #ffffff22}
.d8 .mas{position:absolute;left:500px;top:48px;right:48px;columns:4;column-gap:14px}.d8 .mas img{width:100%;margin-bottom:14px}

/* 09 Departure board */
.d9{background:#0e0f10;color:#f2c94c;font-family:'IBM Plex Mono'}
.d9 .top{padding:36px 60px;display:flex;justify-content:space-between;color:#e9e5dc;font-size:14px;letter-spacing:2px}
.d9 .row{display:grid;grid-template-columns:200px 1fr 220px;align-items:center;gap:24px;padding:16px 60px;border-top:1px solid #222}
.d9 .row .t{font:500 34px 'IBM Plex Mono';letter-spacing:4px}.d9 .row .strip{display:flex;gap:8px}.d9 .row .strip img{width:84px;height:110px}
.d9 .row .st{font-size:15px;letter-spacing:2px;color:#e9e5dc}.d9 .row.on{background:#1a1b1d}.d9 .row.on .st{color:#7ed492}
.d9 .sw{position:absolute;left:60px;bottom:40px}.d9 .sw i{width:56px;height:20px}

/* 10 Laundrette noticeboard */
.d10{background:#b88a58;color:#2b1d12;font-family:Caveat;background-image:radial-gradient(#9c703f 1.2px,transparent 1.4px);background-size:14px 14px}
.d10 .card{position:absolute;background:#fbf8f1;padding:12px 12px 44px;box-shadow:0 6px 14px #0000003a}.d10 .card b{position:absolute;bottom:8px;left:14px;font:700 22px Caveat}
.d10 .pin{position:absolute;top:-8px;left:50%;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:#c23a2b;box-shadow:0 2px 3px #0005}
.d10 .note{position:absolute;left:56px;top:40px;background:#f3e27a;padding:24px 30px;font:700 52px Caveat;transform:rotate(-3deg);box-shadow:0 6px 14px #0000003a}
.d10 .sw{position:absolute;right:60px;bottom:50px;background:#fbf8f1;padding:14px;transform:rotate(2deg);box-shadow:0 6px 14px #0000003a}.d10 .sw i{width:40px;height:40px}
</style>
</head>
<body>
<div class="head">
  <h1>Selvedge board: ten directions</h1>
  <p>The same board in each: Summer 2026, your saves, the palette, and one piece selected for editing. Rough frames for the feel, not finished designs. Click one to see it full size.</p>
</div>
<div class="grid" id="grid"></div>
<div class="overlay" id="ov"><div class="holder" id="holder"></div></div>

<script>
const im = (n) => `board/${String(n).padStart(2, "0")}.jpg`;
const PAL = ["#4b3326", "#efe6d3", "#6b6e4e", "#6c7378", "#2a3550", "#1d1b19"];
const sw = (cls = "") => `<div class="sw ${cls}">${PAL.map((c) => `<i style="background:${c}"></i>`).join("")}</div>`;
const tools = (x, y, bg, fg) => `<div class="tools" style="left:${x}px;top:${y}px;--toolbg:${bg};--toolfg:${fg}"><span>Smaller</span><span>Bigger</span><span>Remove</span></div>`;
const src = ["Pinterest", "Instagram", "Gallery"];

const D = [
  ["01", "Sketchbook scroll", "Seed: one tall column, heavy title, indigo ink on cream", "d1", () => `
    <div class="top"><h2>Summer<br>2026</h2><div class="seasons"><u>Summer 2026</u><span>Spring 2026</span><span>+ New board</span></div></div>
    <div class="col">${[1, 7].map((n, i) => `<div class="${i ? "pick" : ""}" style="--sel:#1f2a44"><img src="${im(n)}"><p>${i ? "Camp shirt, long denim shorts" : "Brown boxy tee, cream wide jeans"}</p></div>`).join("")}</div>
    <div class="side">${[6, 11, 16].map((n) => `<img src="${im(n)}">`).join("")}</div>${sw()}`],
  ["02", "Contact sheet", "Seed: a numbered proof sheet, red grease pencil marks the picks", "d2", () => `
    <div class="top"><span><b>SELVEDGE</b> &nbsp; SUMMER 2026 &nbsp;·&nbsp; 18 FRAMES &nbsp;·&nbsp; 9 ON THE BOARD</span><span>SPRING 2026 &nbsp; + NEW</span></div>
    <div class="gr">${Array.from({ length: 14 }, (_, i) => i + 1).map((n) => `<div class="cell"><img src="${im(n)}">${[1, 3, 5, 7, 10, 14].includes(n) ? '<div class="ring"></div>' : ""}<em>${String(n).padStart(2, "0")} · ${src[n % 3]}</em></div>`).join("")}</div>${sw()}`],
  ["03", "Clothes rail", "Seed: saves hang from one long rail, tobacco and olive", "d3", () => `
    <div class="top"><h2>Summer 2026</h2><span>Spring 2026 &nbsp;&nbsp; + New rail</span></div><div class="rail"></div>
    ${[[1, 70, 210, 330], [3, 300, 190, 300], [7, 510, 200, 360], [10, 730, 190, 320], [14, 940, 200, 350], [5, 1160, 210, 330]].map(([n, x, w, h], i) => `<div class="hang ${i === 2 ? "pick" : ""}" style="left:${x}px;--sel:#efe4d0"><div class="hook"></div><img src="${im(n)}" style="width:${w}px;height:${h}px"></div>`).join("")}${sw()}`],
  ["04", "Tailor's pattern paper", "Seed: kraft pattern sheet, dashed cut lines, chalk labels", "d4", () => `
    <h2>Summer 2026</h2><div class="meta">pieces: 9 · next: Spring 2026 · + new sheet</div>
    ${[[6, 70, 200, 300, 380, "the vest"], [16, 420, 230, 240, 400, "camp shirt"], [5, 710, 180, 220, 420, "double-knees"], [13, 980, 240, 230, 380, "white socks"]].map(([n, x, y, w, h, t], i) => `<div class="piece ${i === 1 ? "pick" : ""}" style="left:${x}px;top:${y}px;--sel:#3b2a1a"><img src="${im(n)}" style="width:${w}px;height:${h}px"><b>${t}</b></div>`).join("")}${sw()}`],
  ["05", "Designer's sketchbook", "References: taped in, ink notes, palette as watercolour daubs", "d5", () => `
    <div class="top"><h2><i>Summer</i> 2026</h2><div class="tabs"><b>Summer 2026</b><span>Spring 2026</span><span>+ New board</span></div></div>
    ${[[1, 560, 70, 250, 380], [6, 840, 110, 270, 340], [10, 1140, 60, 230, 400], [14, 600, 490, 220, 360], [8, 860, 500, 240, 330], [5, 1130, 500, 240, 350]].map(([n, x, y, w, h], i) => `<div class="tp ${i === 1 ? "pick" : ""}" style="left:${x}px;top:${y}px;--sel:#2b241f"><img src="${im(n)}" style="width:${w}px;height:${h}px"></div>`).join("")}
    <div class="note" style="left:76px;top:250px">roomy, earthy,<br>always the socks</div>${tools(840, 470, "#2b241f", "#f6f1e7")}
    <div class="daubs">${PAL.map((c) => `<i style="background:${c}"></i>`).join("")}</div>`],
  ["06", "Museum wall", "Far away: hung like an exhibition, a small label under each piece", "d6", () => `
    <div class="plac"><h2>Summer 2026</h2><p>Eighteen saves, March to June. Relaxed shapes in earthy colours.</p>${sw()}</div>
    <div class="nav"><b>Summer 2026</b><span>Spring 2026</span><span>+ New board</span></div>
    ${[[1, 420, 170, 220, 330], [16, 680, 210, 210, 290], [7, 930, 160, 220, 340], [11, 1190, 230, 170, 200]].map(([n, x, y, w, h], i) => `<div class="work ${i === 2 ? "pick" : ""}" style="left:${x}px;top:${y}px"><img src="${im(n)}" style="width:${w}px;height:${h}px"><p>${src[n % 3]} · 14 May 2026</p></div>`).join("")}`],
  ["07", "Care label", "Far away: the palette and facts as a woven garment label, a lookbook beside it", "d7", () => `
    <div class="label"><h2>Summer<br>2026</h2>${sw()}
    ${[["Fit", "Relaxed, roomy"], ["Colours", "Earth, cream, navy"], ["Pieces", "18"], ["Feet", "Bostons, socks"], ["Next", "Spring 2026"]].map(([a, b]) => `<div class="r"><span>${a}</span><span>${b}</span></div>`).join("")}</div>
    <div class="gr">${[1, 3, 7, 10, 14, 6, 13, 16].map((n, i) => `<div class="${i === 2 ? "pick" : ""}"><img src="${im(n)}"></div>`).join("")}</div>`],
  ["08", "Selvedge edge", "The name: denim indigo with the white and red selvedge stripe as the spine", "d8", () => `
    <div class="spine"></div><div class="top"><h2>Summer 2026</h2><p>18 saves · 9 on the board</p><div class="seasons"><b>Summer 2026</b><span>Spring 2026</span><span>+ New board</span></div></div>
    <div class="mas">${[1, 6, 7, 3, 10, 14, 5, 16, 13, 11, 8, 15].map((n, i) => `<img src="${im(n)}" class="${i === 4 ? "pick" : ""}" style="--sel:#efe9dc;height:${[300, 220, 330, 260][i % 4]}px">`).join("")}</div>${sw()}`],
  ["09", "Departure board", "Sounds wrong: seasons as departures, each board a platform", "d9", () => `
    <div class="top"><span>SELVEDGE · BOARDS</span><span>22 OCT 2026</span></div>
    ${[["SUM 26", [1, 7, 10, 14, 5, 16], "BOARDING NOW", 1], ["SPR 26", [3, 13, 8, 11], "DEPARTED", 0], ["AUT 26", [], "+ NEW BOARD", 0]].map(([t, ns, st, on]) => `<div class="row ${on ? "on" : ""}"><div class="t">${t}</div><div class="strip">${ns.map((n) => `<img src="${im(n)}">`).join("")}</div><div class="st">${st}</div></div>`).join("")}${sw()}`],
  ["10", "Laundrette noticeboard", "Sounds wrong: pinned to cork like notes in a launderette", "d10", () => `
    <div class="note">Summer 2026</div>
    ${[[1, 420, 60, 200, 270, -3, "the brown tee"], [7, 680, 90, 200, 280, 2, "socks + bostons"], [10, 940, 50, 200, 270, -2, "stripes"], [6, 1180, 100, 190, 250, 3, "the vest"], [14, 520, 470, 200, 260, 2, "checks"], [13, 800, 480, 190, 270, -3, "white tee"]].map(([n, x, y, w, h, r, t], i) => `<div class="card ${i === 3 ? "pick" : ""}" style="left:${x}px;top:${y}px;transform:rotate(${r}deg);--sel:#2b1d12"><div class="pin"></div><img src="${im(n)}" style="width:${w}px;height:${h}px"><b>${t}</b></div>`).join("")}${sw()}`],
];

const grid = document.getElementById("grid");
grid.innerHTML = D.map(([n, name, why, cls, body]) => `<div><div class="thumb" data-i="${n}"><div class="frame ${cls}">${body()}</div></div><div class="cap"><b>${n}</b><strong>${name}</strong><span>${why}</span></div></div>`).join("");

function fit() { document.querySelectorAll(".thumb").forEach((t) => (t.firstElementChild.style.transform = `scale(${t.clientWidth / 1440})`)); }
addEventListener("resize", fit); fit();

const ov = document.getElementById("ov"), holder = document.getElementById("holder");
grid.addEventListener("click", (e) => {
  const t = e.target.closest(".thumb"); if (!t) return;
  const s = Math.min((innerWidth - 60) / 1440, (innerHeight - 60) / 900);
  holder.style.width = 1440 * s + "px"; holder.style.height = 900 * s + "px";
  holder.innerHTML = t.innerHTML; holder.firstElementChild.style.transform = `scale(${s})`; ov.classList.add("on");
});
ov.addEventListener("click", () => ov.classList.remove("on"));
</script>
</body>
</html>
