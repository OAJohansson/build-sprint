<!doctype html>
<html lang="en" style="color-scheme:dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101918">
<title>check</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden;background:#101918}
ul,ol{list-style:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-weight:inherit;font-size:inherit;text-wrap:balance}
p{text-wrap:pretty}
.screen{width:1440px;height:900px;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
svg.threads{position:absolute;inset:0;width:1440px;height:900px;pointer-events:none}
svg.threads path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#chk{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.screen{--ground:#101918;--lift:#18231f;--bone:#e9e2d4;--brass:#d3a66c;--quiet:rgba(233,226,212,.72);--faint:rgba(233,226,212,.14);
  background:radial-gradient(1100px 820px at 34% 46%,#1f2d29 0%,#141f1d 52%,#0c1413 100%);color:var(--bone);font:400 15px/1.45 'Hanken Grotesk',sans-serif}
.yarn ellipse,.yarn circle{fill:none;stroke:#e9e2d4;stroke-width:.9}
svg.threads path.th{stroke:#e9e2d4;stroke-opacity:.3;stroke-width:1}
svg.threads path.far{stroke-opacity:.15}
svg.threads path.focus{stroke-opacity:.9;stroke-width:1.6}
svg.threads path.focus.against{stroke-dasharray:1.5 6}
svg.threads path.satline{stroke:#d3a66c;stroke-opacity:.9;stroke-width:1.3}
header{position:absolute;left:44px;top:36px;display:flex;align-items:center;gap:22px}
.wm{font:400 25px/1 Fraunces,serif;letter-spacing:-.01em;display:flex;align-items:center;gap:11px}
.wm{padding:6px 8px;margin:-6px -8px;border-radius:10px;transition:transform 160ms cubic-bezier(.23,1,.32,1)}
.yt{font-size:14px;color:var(--quiet);padding:9px 12px;margin:-9px 0;border-radius:10px;display:flex;align-items:center;gap:9px;transition:transform 160ms cubic-bezier(.23,1,.32,1),color 160ms ease,background-color 160ms ease}
.yt i{width:8px;height:8px;border-radius:50%;background:var(--bone);box-shadow:0 0 0 2px var(--ground),0 0 0 3.5px var(--brass)}
.yt[aria-expanded=true]{color:var(--bone);background:rgba(233,226,212,.08)}
.caption{position:absolute;left:44px;bottom:40px;width:330px;font:300 25px/1.22 Fraunces,serif;letter-spacing:-.015em;font-variation-settings:'opsz' 100}
.n{position:absolute;width:0;height:0}
.n .dot{position:absolute;left:0;top:0;border-radius:50%;background:var(--bone);transform:translate(-50%,-50%);transition:box-shadow 160ms ease}
.n.v .dot{background:rgba(233,226,212,.8);box-shadow:0 0 0 2.5px var(--ground),0 0 0 4px var(--brass)}
.n.t1.v .dot{background:var(--bone)}
.n .lb{position:absolute;visibility:hidden;white-space:nowrap;display:flex;flex-direction:column;width:max-content}
.n .lb::before{content:"";position:absolute;inset:-9px -10px}
.n b{font:400 15px/1.25 'Hanken Grotesk',sans-serif;color:rgba(233,226,212,.78)}
.n .dot{opacity:.78}
.n.back2 b{font-size:14px;color:rgba(233,226,212,.7)}
.n.back2 .dot{opacity:.62}
.n.t1 .dot,.n.v .dot{opacity:1}
.n.t1 b{font:400 22px/1.15 Fraunces,serif;letter-spacing:-.005em;color:var(--bone);margin-top:2px}
.n em{font-style:normal;font-size:13.5px;line-height:1.25;color:var(--bone);letter-spacing:.005em}
.n b.wrap{max-width:170px;white-space:normal;text-wrap:balance}
.n.t1 b.wrap{max-width:230px}
.title{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;text-align:center;width:max-content;max-width:310px;padding:2px 4px}
.title .here{width:14px;height:14px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 7px rgba(211,166,108,.16);margin-bottom:11px}
.title h1{font:300 48px/1.02 Fraunces,serif;letter-spacing:-.025em;font-variation-settings:'opsz' 144}
.title p{font-size:13.5px;color:rgba(233,226,212,.84);margin-top:9px;white-space:nowrap}
.sat{position:absolute;transform:translate(-7px,-50%);display:flex;align-items:center;gap:10px;font:400 17px/1.2 Fraunces,serif;white-space:nowrap;padding:4px 0}
.sat i{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--brass);background:var(--ground);flex-shrink:0}
.card{position:absolute;left:1010px;top:50%;transform:translateY(-50%);width:386px;max-height:860px;background:var(--lift);border:1px solid var(--faint);border-radius:22px;padding:24px 28px 18px;box-shadow:0 40px 80px -40px rgba(0,0,0,.55)}
.card h2{font-size:13.5px;color:var(--quiet);margin-bottom:12px}
.q li{font:300 18px/1.3 Fraunces,serif;letter-spacing:-.01em;font-variation-settings:'opsz' 60;text-wrap:balance}
.q li+li{margin-top:9px}
.card hr{border:0;border-top:1px solid var(--faint);margin:16px 0 13px}
.card h2{margin-bottom:8px}
.th-list{margin:0 -12px}
.th-list button{display:flex;justify-content:space-between;align-items:baseline;gap:12px;width:100%;padding:7px 12px;border-radius:10px;font-size:15.5px;transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 160ms ease}
.th-list span{min-width:0}.th-list .yr{font-size:13px;color:var(--quiet);flex-shrink:0;white-space:nowrap}
.tm{margin:0 -12px}
.tm>li>button{display:block;width:100%;padding:7px 12px;border-radius:10px;font-size:15.5px;transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 160ms ease}
.tm li.open{background:rgba(233,226,212,.06);border-radius:12px;margin:3px 0;padding-bottom:12px}
.tm li.open>button{font-weight:600;padding-top:11px}
.tm p{font-size:14.5px;line-height:1.5;color:rgba(233,226,212,.86);padding:0 12px}
.tm p.who{font-size:13.5px;color:var(--quiet);margin-top:7px}
.tm p.who button{color:var(--bone);border-bottom:1px solid var(--faint)}
.card .up{font-size:13.5px;color:var(--quiet);padding:8px 12px;margin:-8px -12px 12px;border-radius:10px;display:inline-block}
.card h2.who{font:300 36px/1.06 Fraunces,serif;letter-spacing:-.02em;font-variation-settings:'opsz' 144;color:var(--bone);margin:0}
.card .dates{font-size:13.5px;color:var(--quiet);margin:8px 0 14px}
.card .sum{font-size:15.5px;line-height:1.55;color:rgba(233,226,212,.88)}
.ideas{margin:16px 0 22px}
.ideas li{font:400 17.5px/1.3 Fraunces,serif;padding-left:22px;position:relative}
.ideas li+li{margin-top:8px}
.ideas li:before{content:"";position:absolute;left:0;top:.62em;width:12px;border-top:1.5px solid var(--brass)}
.study{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;background:var(--brass);color:#1a1408;font:600 15.5px/1 'Hanken Grotesk',sans-serif;padding:16px 20px;border-radius:13px;transition:transform 160ms cubic-bezier(.23,1,.32,1),background-color 160ms ease}
.study.done{background:transparent;color:var(--brass);box-shadow:inset 0 0 0 1.5px var(--brass)}
.hint{font-size:13px;color:var(--quiet);text-align:center;margin-top:11px}
.prompt{font-size:14.5px;line-height:1.5;color:rgba(233,226,212,.88);background:rgba(233,226,212,.05);border-radius:12px;padding:12px 14px;margin-top:14px}
.prompt span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.hist{margin:14px 0 0}
.hist li{display:grid;grid-template-columns:116px 1fr;gap:0 10px;padding:11px 0;border-top:1px solid var(--faint);align-items:baseline}
.hist time{font-size:13.5px;color:var(--quiet);white-space:nowrap}
.hist button{display:block;font:400 18px/1.25 Fraunces,serif;padding:2px 0}
.hist button.p{font:400 14.5px/1.3 'Hanken Grotesk',sans-serif;color:var(--quiet)}
.big{font:300 30px/1.1 Fraunces,serif;letter-spacing:-.02em;font-variation-settings:'opsz' 144}
.since{font-size:13.5px;color:var(--quiet);margin-top:6px}
.x{position:absolute;right:16px;top:14px;font-size:13.5px;color:var(--quiet);padding:8px 10px;border-radius:10px}
.others{font-size:13.5px;color:var(--quiet);margin-top:18px;padding-top:14px;border-top:1px solid var(--faint);white-space:nowrap}
.others button{color:var(--bone);border-bottom:1px solid var(--faint)}
button:focus-visible{outline:2px solid var(--brass);outline-offset:4px}
button:active{transform:scale(.97)}
.n:active{transform:none}.n:active .lb{opacity:.8}
@media (hover:hover){.yt:hover,.x:hover{color:var(--bone)}.th-list button:hover,.tm>li>button:hover{background:rgba(233,226,212,.07)}.hist button:hover{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}.study:hover{background:#dfb57e}.study.done:hover{background:transparent}
  .n:hover b{color:var(--bone);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:5px}.n:hover .dot{box-shadow:0 0 0 5px rgba(233,226,212,.16)}.n.v:hover .dot{box-shadow:0 0 0 2.5px var(--ground),0 0 0 4px var(--brass),0 0 0 8px rgba(233,226,212,.14)}
  .others button:hover,.tm p.who button:hover{border-color:var(--bone)}}

</style></head>

<script>window.WEB={"c":[500,456],"R":410,"w":1440,"h":900};</script><script>
(function(){
const S=document.querySelector('.screen'),W=window.WEB;if(!S||!W)return;
function run(){
  const sb=S.getBoundingClientRect();
  const rectOf=e=>{const r=e.getBoundingClientRect();return{x:r.left-sb.left,y:r.top-sb.top,w:r.width,h:r.height,id:e.dataset.id||e.className}};
  const fixed=[...S.querySelectorAll('.solid')].map(rectOf);
  const nodes=[...S.querySelectorAll('.n')].map(e=>({e,id:e.dataset.id,lb:e.querySelector('.lb'),x:+e.dataset.x,y:+e.dataset.y,r:+e.dataset.r,pref:+e.dataset.pref,ord:+e.dataset.ord}));
  const pts=[];S.querySelectorAll('svg.threads path.th').forEach(p=>{const n=p.getTotalLength(),w=p.classList.contains('focus')?14:1;for(let s=0;s<=n;s+=4){const q=p.getPointAtLength(s);pts.push([q.x,q.y,w,p.dataset.a+'-'+p.dataset.b])}});
  const placed=[];
  const hit=(a,b,pad)=>a.x<b.x+b.w+pad&&b.x<a.x+a.w+pad&&a.y<b.y+b.h+pad&&b.y<a.y+a.h+pad;
  nodes.slice().sort((a,b)=>a.ord-b.ord).forEach(n=>{
    const w=n.lb.offsetWidth,h=n.lb.offsetHeight;let best=null;
    const cand=[];[9,20,32].forEach((gap,gi)=>[0,30,-30,60,-60,90,-90,120,-120,150,-150,180].forEach((d,i)=>cand.push([d,n.r+gap,i*2+gi*9])));
    cand.forEach(([d,g,base])=>{const i=base/2;
      const a=(n.pref+d)*Math.PI/180,c=Math.cos(a),s=Math.sin(a),ax=n.x+g*c,ay=n.y+g*s;
      const x=c>.38?ax:c<-.38?ax-w:ax-w/2,y=s>.38?ay:s<-.38?ay-h:ay-h/2,R={x,y,w,h};
      let cost=base;
      placed.forEach(p=>{if(hit(R,p,6))cost+=5000});fixed.forEach(p=>{if(hit(R,p,8))cost+=5000});
      nodes.forEach(m=>{if(m!==n){const nx=Math.max(x,Math.min(m.x,x+w)),ny=Math.max(y,Math.min(m.y,y+h));const dm=Math.hypot(nx-m.x,ny-m.y);if(dm<m.r+8)cost+=4500;else if(dm<g+10)cost+=2500}});
      [[x,y],[x+w,y],[x,y+h],[x+w,y+h]].forEach(k=>{if(Math.hypot(k[0]-W.c[0],k[1]-W.c[1])>W.R-4)cost+=450});
      if(x<8||y<8||x+w>W.w-8||y+h>W.h-8)cost+=3000;
      for(const q of pts){if(q[0]>x-3&&q[0]<x+w+3&&q[1]>y-3&&q[1]<y+h+3)cost+=7*q[2]}
      if(!best||cost<best.cost)best={cost,x,y,al:c>.38?'flex-start':c<-.38?'flex-end':'center',ta:c>.38?'left':c<-.38?'right':'center'}});
    n.lb.style.left=(best.x-n.x)+'px';n.lb.style.top=(best.y-n.y)+'px';n.lb.style.alignItems=best.al;n.lb.style.textAlign=best.ta;n.lb.style.visibility='visible';
    placed.push({x:best.x,y:best.y,w,h,id:n.id});
  });
  // a thread never draws through a label: labels knock out whatever passes behind them
  const ko=S.querySelector('#ko');if(ko)placed.concat([...S.querySelectorAll('.kox')].map(rectOf)).forEach(p=>{const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',p.x-5);r.setAttribute('y',p.y-3);r.setAttribute('width',p.w+10);r.setAttribute('height',p.h+6);r.setAttribute('rx',6);r.setAttribute('fill','#000');ko.appendChild(r)});
  if(location.hash==='#check'){
    const out=[];
    placed.forEach(p=>{const t=new Set();pts.forEach(q=>{if(q[0]>p.x-1&&q[0]<p.x+p.w+1&&q[1]>p.y-1&&q[1]<p.y+p.h+1)t.add(q[3])});t.forEach(k=>out.push('THREAD '+k+' x LABEL '+p.id));
      fixed.forEach(f=>{if(hit(p,f,0))out.push('LABEL '+p.id+' x '+f.id)});
      if(p.x<8||p.y<8||p.x+p.w>W.w-8||p.y+p.h>W.h-8)out.push('OFFSCREEN '+p.id);
      if([[p.x,p.y],[p.x+p.w,p.y],[p.x,p.y+p.h],[p.x+p.w,p.y+p.h]].some(k=>Math.hypot(k[0]-W.c[0],k[1]-W.c[1])>W.R+2))out.push('OUTSIDE GLOBE '+p.id);
      nodes.forEach(m=>{if(m.id!==p.id){const nx=Math.max(p.x,Math.min(m.x,p.x+p.w)),ny=Math.max(p.y,Math.min(m.y,p.y+p.h));if(Math.hypot(nx-m.x,ny-m.y)<m.r+1)out.push('LABEL '+p.id+' x DOT '+m.id)}})});
    for(let i=0;i<placed.length;i++)for(let j=i+1;j<placed.length;j++)if(hit(placed[i],placed[j],0))out.push('LABEL '+placed[i].id+' x LABEL '+placed[j].id);
    fixed.filter(f=>!/title|sat/.test(f.id)).forEach(f=>{const t=new Set();pts.forEach(q=>{if(q[0]>f.x&&q[0]<f.x+f.w&&q[1]>f.y&&q[1]<f.y+f.h)t.add(q[3])});t.forEach(k=>out.push('THREAD '+k+' x '+f.id))});
    const pre=document.createElement('pre');pre.id='chk';pre.textContent='CHECK\n'+out.join('\n')+'\nEND';document.body.appendChild(pre);
  }
}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(run,60));
})();</script>
