<!doctype html>
<html lang="en" style="color-scheme:dark"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101918">
<title>Meander · Clew · phone</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;1,9..144,300&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{width:390px;height:844px;overflow:hidden;background:#101918}
ul,ol{list-style:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;text-align:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
h1,h2,h3{font-weight:inherit;font-size:inherit;text-wrap:balance}
p{text-wrap:pretty}
.screen{width:390px;height:844px;position:relative;overflow:hidden;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
svg.threads{position:absolute;inset:0;width:390px;height:844px;pointer-events:none}
svg.threads path{fill:none;stroke-linecap:round;stroke-linejoin:round}
#chk{display:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.screen{--ground:#101918;--lift:#18231f;--bone:#e9e2d4;--brass:#d3a66c;--quiet:rgba(233,226,212,.72);--faint:rgba(233,226,212,.14);background:linear-gradient(180deg,#1b2825 0%,#111b19 60%,#0d1514 100%);color:var(--bone);font:400 16px/1.45 'Hanken Grotesk',sans-serif;padding:14px 22px 0}
header{display:flex;align-items:center;justify-content:space-between;height:48px}
.wm{font:400 22px/1 Fraunces,serif;display:flex;align-items:center;gap:9px}
.back{font-size:14px;color:var(--quiet);padding:12px 4px;min-height:44px}
.here{display:block;width:13px;height:13px;border-radius:50%;background:var(--brass);box-shadow:0 0 0 6px rgba(211,166,108,.16);margin:30px 0 14px 6px}
h1{font:300 42px/1.02 Fraunces,serif;letter-spacing:-.025em;font-variation-settings:'opsz' 144}
.meta{font-size:14px;color:rgba(233,226,212,.84);margin-top:8px}
.meta button{color:var(--bone);border-bottom:1px solid rgba(233,226,212,.4);padding:4px 0}
h2{font-size:14px;color:var(--quiet);margin:30px 0 6px}
.near{position:relative;margin-left:6px}
.near button{display:grid;grid-template-columns:13px 1fr;gap:0 18px;align-items:center;width:100%;padding:9px 0;min-height:64px;position:relative}
.near i{width:13px;height:13px;border-radius:50%;background:var(--bone);box-shadow:0 0 0 4px #15201e}
.near .v i{box-shadow:0 0 0 2.5px #15201e,0 0 0 4px var(--brass)}
.near em{display:block;font-style:normal;font-size:14px;line-height:1.2;color:var(--bone)}
.near b{display:block;font:400 23px/1.15 Fraunces,serif;margin-top:2px}
.near small{display:block;font-size:13px;color:var(--quiet)}
.q li{font:300 20px/1.3 Fraunces,serif;letter-spacing:-.01em;text-wrap:balance}
.q li+li{margin-top:12px}
button:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
button:active{transform:scale(.98)}
</style></head>
<body>
<div class="screen"><header><button class="wm" translate="no"><svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="#e9e2d4" stroke-width="1.1"><circle cx="12" cy="12" r="10.5"/><ellipse cx="12" cy="12" rx="10.5" ry="4.2" transform="rotate(-28 12 12)"/><ellipse cx="12" cy="12" rx="10.5" ry="7.4" transform="rotate(48 12 12)" stroke="#d3a66c"/></g></svg>Meander</button><button class="back">Your thread</button></header>
<main><i class="here"></i><h1>Existentialism</h1><p class="meta">1840s–1960s · you are here</p>
<h2>One thread away</h2><ul class="near"><li><button class="v"><i></i><span><em>pushed against</em><b>German Idealism</b></span></button></li><li><button class=""><i></i><span><em>built on</em><b>Phenomenology</b></span></button></li><li><button class=""><i></i><span><em>grew from it</em><b>Absurdism</b></span></button></li><li><button class=""><i></i><span><em>pushed back</em><b>Post-structuralism</b></span></button></li><li><button class=""><i></i><span><em>built on</em><b>Romanticism</b></span></button></li><li><button class=""><i></i><span><em>grew from it</em><b>Feminist philosophy</b></span></button></li></ul>
<h2>It asks</h2><ol class="q"><li>If nothing hands me a purpose, how do I live?</li><li>What does it mean to be free, and to answer for it?</li><li>How do I live as myself, and not as the crowd expects?</li></ol>
<h2>Thinkers</h2></main></div>

</body></html>
