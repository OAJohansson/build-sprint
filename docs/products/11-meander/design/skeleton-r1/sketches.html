<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Skeleton sketches</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=Hanken+Grotesk:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ground:#101918;--lift:#18231f;--bone:#e9e2d4;--brass:#d3a66c;--quiet:rgba(233,226,212,.72);--dim:rgba(233,226,212,.45);--faint:rgba(233,226,212,.14);--serif:"Fraunces",Georgia,serif;--sans:"Hanken Grotesk",system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:#0b1110;color:var(--bone);font-family:var(--sans);padding:32px 16px 64px}
header{max-width:1520px;margin:0 auto 28px}
header h1{font-family:var(--serif);font-weight:400;font-size:28px}
header p{color:var(--quiet);font-size:14px;margin-top:6px;max-width:70ch;line-height:1.5}
.grid{max-width:1520px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,720px),1fr));gap:28px}
figure{display:flex;flex-direction:column;gap:10px}
figcaption{font-size:13px;color:var(--quiet);line-height:1.45}
figcaption b{color:var(--bone);font-family:var(--serif);font-weight:500;font-size:16px;margin-right:6px}
.p{position:relative;aspect-ratio:16/10;background:var(--ground);border:1px solid var(--faint);border-radius:14px;overflow:hidden;padding:36px 40px}
.serif{font-family:var(--serif)}
.k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.h{font-family:var(--serif);font-weight:300;font-size:46px;line-height:1}
.q{font-family:var(--serif);font-size:19px;color:var(--quiet);line-height:1.3}
.meta{font-size:12.5px;color:var(--dim)}
.brass{color:var(--brass)}
.fold{position:absolute;left:0;right:0;bottom:0;height:44px;border-top:1px dashed var(--faint);display:flex;align-items:center;padding:0 40px;font-size:12px;color:var(--dim);background:linear-gradient(transparent,rgba(0,0,0,.25))}
svg text{font-family:var(--sans);fill:var(--quiet)}
svg .st{font-family:var(--serif);fill:var(--bone)}
ol.n{list-style:none;padding:0;counter-reset:n}
ol.n li{counter-increment:n;font-family:var(--serif);font-size:17px;padding:5px 0;display:flex;gap:12px}
ol.n li::before{content:counter(n);font-family:var(--sans);font-size:11px;color:var(--brass);width:12px;padding-top:5px}
</style></head><body>
<header>
<h1>Skeleton: eight rough directions</h1>
<p>Rough sketches for picking, not designs. Each one is the top of the school view after you click Existentialism on the globe. The dashed line at the bottom is where the article starts. Real content from the pilot.</p>
</header>
<div class="grid">

<!-- 1 Ball unwinds -->
<figure><div class="p" style="padding:0">
<svg viewBox="0 0 720 450" width="100%" height="100%">
<circle cx="360" cy="215" r="170" fill="none" stroke="rgba(233,226,212,.10)"/>
<text x="360" y="38" text-anchor="middle" font-size="10" letter-spacing="1">1843 · · · · · · · · · TIME AROUND THE RING · · · · · · · · · 1949</text>
<g stroke="rgba(211,166,108,.7)" fill="none" stroke-width="1.2">
<path d="M360 215 C 330 150, 260 120, 215 92"/><path d="M360 215 C 420 160, 480 130, 520 98"/>
<path d="M360 215 C 450 220, 520 230, 560 250"/><path d="M360 215 C 420 290, 470 330, 505 355"/>
<path d="M360 215 C 300 290, 250 330, 210 352"/><path d="M360 215 C 270 215, 200 222, 160 240"/></g>
<circle cx="360" cy="215" r="7" fill="#d3a66c"/>
<text class="st" x="360" y="250" text-anchor="middle" font-size="24">Existentialism</text>
<g font-size="12.5"><text x="215" y="82" text-anchor="middle">Existence before essence</text><text x="525" y="88" text-anchor="middle">Freedom and anxiety</text>
<text x="566" y="270" text-anchor="start">Authenticity vs the crowd</text><text x="512" y="375" text-anchor="middle">Meaning without guarantees</text>
<text x="205" y="372" text-anchor="middle">My freedom needs yours</text><text x="152" y="232" text-anchor="end">Faith and the leap</text></g>
<g fill="#e9e2d4"><circle cx="262" cy="118" r="3"/><circle cx="470" cy="134" r="3"/><circle cx="500" cy="226" r="3"/><circle cx="455" cy="320" r="3"/><circle cx="265" cy="318" r="3"/><circle cx="220" cy="220" r="3"/></g>
<text x="270" y="134" font-size="10">Sartre</text><text x="478" y="150" font-size="10">Kierkegaard</text><text x="463" y="316" font-size="10">Camus</text><text x="272" y="334" font-size="10">Beauvoir</text>
</svg><div class="fold">Article ↓</div></div>
<figcaption><b>1 · The ball unwinds</b>The school's knot unwinds into six threads, one per idea. Thinkers are beads on their threads; the ring is time.</figcaption></figure>

<!-- 2 Museum label -->
<figure><div class="p">
<div class="k">School · 1843–1949</div>
<div class="h" style="margin-top:14px">Existentialism</div>
<div class="q" style="margin-top:14px;max-width:30ch">If nothing hands me a purpose, how do I live?</div>
<ol class="n" style="position:absolute;right:40px;top:36px;width:300px">
<li>Existence before essence</li><li>Freedom and anxiety</li><li>Authenticity versus the crowd</li><li>Meaning without guarantees</li><li>My freedom needs yours</li><li>Faith and the leap</li></ol>
<svg viewBox="0 0 640 40" style="position:absolute;left:40px;right:40px;bottom:74px;width:calc(100% - 80px)">
<line x1="0" y1="20" x2="640" y2="20" stroke="rgba(233,226,212,.25)"/>
<g fill="#d3a66c"><circle cx="0" cy="20" r="3.5"/><circle cx="231" cy="20" r="3.5"/><circle cx="466" cy="20" r="3.5"/><circle cx="571" cy="20" r="3.5"/><circle cx="577" cy="20" r="3.5"/><circle cx="590" cy="20" r="3.5"/><circle cx="640" cy="20" r="3.5"/></g>
<text x="0" y="38" font-size="10">1843</text><text x="466" y="38" font-size="10" text-anchor="middle">1927</text><text x="640" y="38" font-size="10" text-anchor="end">1949</text></svg>
<div class="meta" style="position:absolute;left:40px;bottom:60px">6 ideas · 6 thinkers · 7 key works · about 10 minutes</div>
<div class="fold">Article ↓</div></div>
<figcaption><b>2 · Museum wall label</b>One calm panel: name, the big question, six ideas, a thin time strip, one honest count line.</figcaption></figure>

<!-- 3 Route map -->
<figure><div class="p" style="padding:0">
<svg viewBox="0 0 720 450" width="100%" height="100%">
<text class="st" x="40" y="62" font-size="30" font-weight="300">Existentialism</text>
<text x="40" y="86" font-size="13">The route from 1843 to 1949, through seven key works</text>
<g fill="none" stroke-width="3" stroke-linecap="round">
<path d="M60 230 H660" stroke="rgba(233,226,212,.35)"/>
<path d="M60 200 H300 Q330 200 340 230 H660" stroke="#d3a66c"/>
<path d="M60 260 H200 Q230 260 240 230 H560 Q580 230 590 200 H660" stroke="#8fb3a4"/>
<path d="M200 290 H400 Q430 290 440 260 H660" stroke="#c98f8f"/></g>
<g fill="#101918" stroke="#e9e2d4" stroke-width="2"><circle cx="80" cy="230" r="7"/><circle cx="200" cy="230" r="7"/><circle cx="340" cy="230" r="7"/><circle cx="460" cy="230" r="7"/><circle cx="520" cy="230" r="7"/><circle cx="580" cy="230" r="7"/><circle cx="640" cy="230" r="7"/></g>
<g font-size="10.5"><text x="80" y="330" text-anchor="middle">1843</text><text x="80" y="345" text-anchor="middle">Fear and</text><text x="80" y="358" text-anchor="middle">Trembling</text>
<text x="200" y="330" text-anchor="middle">1882</text><text x="200" y="345" text-anchor="middle">Gay Science</text>
<text x="340" y="330" text-anchor="middle">1927</text><text x="340" y="345" text-anchor="middle">Being and Time</text>
<text x="460" y="330" text-anchor="middle">1942</text><text x="460" y="345" text-anchor="middle">Sisyphus</text>
<text x="520" y="160" text-anchor="middle">1943</text><text x="580" y="330" text-anchor="middle">1945</text><text x="640" y="160" text-anchor="middle">1949</text></g>
<g font-size="11"><text x="672" y="204">Freedom</text><text x="672" y="234">Authenticity</text><text x="672" y="264">Meaning</text></g>
</svg><div class="fold">Article ↓</div></div>
<figcaption><b>3 · Train route map</b>Time runs left to right; key works are stations; ideas are coloured lines through the stations where they show up.</figcaption></figure>

<!-- 4 Six tiles -->
<figure><div class="p">
<div style="display:flex;align-items:baseline;justify-content:space-between"><div class="h" style="font-size:34px">Existentialism</div><div class="meta">about 10 minutes</div></div>
<div style="display:grid;grid-template-columns:1.25fr 1fr .9fr;grid-template-rows:1fr 1fr;gap:10px;margin-top:22px;height:290px">
<div style="border:1px solid var(--faint);border-radius:10px;padding:14px"><div class="serif" style="font-size:17px">Existence before essence</div><div class="meta" style="margin-top:6px">Your choices shape who you become</div><div class="brass" style="font-size:11px;margin-top:10px">JPS</div></div>
<div style="border:1px solid var(--faint);border-radius:10px;padding:14px"><div class="serif" style="font-size:17px">Freedom and anxiety</div><div class="brass" style="font-size:11px;margin-top:10px">SK · JPS</div></div>
<div style="border:1px solid var(--faint);border-radius:10px;padding:14px;grid-row:span 2"><div class="serif" style="font-size:17px">Meaning without guarantees</div><div class="meta" style="margin-top:6px">How can life still mean something?</div><div class="brass" style="font-size:11px;margin-top:10px">FN · AC · SB</div></div>
<div style="border:1px solid var(--faint);border-radius:10px;padding:14px"><div class="serif" style="font-size:17px">Authenticity versus the crowd</div><div class="brass" style="font-size:11px;margin-top:10px">SK · FN · JPS · SB</div></div>
<div style="display:grid;grid-template-rows:1fr 1fr;gap:10px"><div style="border:1px solid var(--faint);border-radius:10px;padding:10px 14px"><div class="serif" style="font-size:15px">My freedom needs yours</div></div><div style="border:1px solid var(--faint);border-radius:10px;padding:10px 14px"><div class="serif" style="font-size:15px">Faith and the leap</div></div></div>
</div><div class="fold">Article ↓</div></div>
<figcaption><b>4 · Six tiles</b>One tile per idea, sized by how much there is to read in it. Thinkers' initials on each tile.</figcaption></figure>

<!-- 5 Contents page -->
<figure><div class="p" style="padding:40px 120px">
<div class="k" style="text-align:center">Contents</div>
<div class="h" style="text-align:center;font-size:36px;margin-top:10px">Existentialism</div>
<div style="margin-top:26px;font-family:var(--serif);font-size:16px;line-height:2.05">
<div style="display:flex"><span>In one minute</span><span style="flex:1;border-bottom:1px dotted var(--faint);margin:0 8px 8px"></span><span class="meta">1 min</span></div>
<div style="display:flex;position:relative"><span class="brass" style="position:absolute;left:-26px">▍</span><span>Six ideas</span><span style="flex:1;border-bottom:1px dotted var(--faint);margin:0 8px 8px"></span><span class="meta">5 min</span></div>
<div style="display:flex"><span>Where it came from · 1843–1949</span><span style="flex:1;border-bottom:1px dotted var(--faint);margin:0 8px 8px"></span><span class="meta">2 min</span></div>
<div style="display:flex"><span>What critics say</span><span style="flex:1;border-bottom:1px dotted var(--faint);margin:0 8px 8px"></span><span class="meta">1 min</span></div>
<div style="display:flex"><span>Apply it to your life</span><span style="flex:1;border-bottom:1px dotted var(--faint);margin:0 8px 8px"></span><span class="meta">2 min</span></div>
</div><div class="fold">Article ↓ &nbsp;·&nbsp; the ribbon marks where you are</div></div>
<figcaption><b>5 · Contents page of a slim book</b>A quiet chapter list with reading minutes. A ribbon bookmark moves as you read.</figcaption></figure>

<!-- 6 Field guide legend -->
<figure><div class="p">
<div class="h" style="font-size:36px">Existentialism</div>
<div class="q" style="margin-top:10px;font-size:17px">Philosophy that starts from the single person who must choose how to live.</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px 32px;margin-top:28px;font-family:var(--serif);font-size:16px">
<div>◯&nbsp;&nbsp; Existence before essence</div><div>△&nbsp;&nbsp; Freedom and anxiety</div>
<div>▢&nbsp;&nbsp; Authenticity vs the crowd</div><div>◇&nbsp;&nbsp; Meaning without guarantees</div>
<div>⋈&nbsp;&nbsp; My freedom needs yours</div><div>↗&nbsp;&nbsp; Faith and the leap</div></div>
<div style="position:absolute;left:40px;bottom:70px;display:flex;align-items:center;gap:10px" class="meta">
<span style="display:inline-block;width:180px;height:6px;background:repeating-linear-gradient(90deg,var(--bone) 0 36px,transparent 36px 72px);border:1px solid var(--dim)"></span> 0 · · · 10 min to read</div>
<div class="fold">Article ↓ &nbsp;·&nbsp; each section wears its idea's symbol</div></div>
<figcaption><b>6 · Field-guide legend</b>Each idea gets a symbol; a scale bar shows reading time; the article sections carry the same symbols, so "you are here" is built in.</figcaption></figure>

<!-- 7 Record sleeve -->
<figure><div class="p" style="display:grid;grid-template-columns:1fr 1fr;gap:40px">
<div><div class="k">Side A</div><div class="h" style="font-size:34px;margin-top:8px">Existentialism</div>
<div class="meta" style="margin-top:14px;line-height:1.7">Recorded 1843–1949<br>Denmark · Germany · France</div>
<div class="q" style="margin-top:20px;font-size:15px;font-style:italic">"If nothing hands me a purpose, how do I live?"</div></div>
<div style="font-size:14px;line-height:2.1">
<div style="display:flex;justify-content:space-between"><span>1. Existence before essence</span><span class="meta">1:30</span></div>
<div style="display:flex;justify-content:space-between"><span>2. Freedom and anxiety</span><span class="meta">1:10</span></div>
<div style="display:flex;justify-content:space-between"><span>3. Authenticity vs the crowd</span><span class="meta">1:40</span></div>
<div style="display:flex;justify-content:space-between"><span>4. Meaning without guarantees</span><span class="meta">1:50</span></div>
<div style="display:flex;justify-content:space-between"><span>5. My freedom needs yours</span><span class="meta">1:00</span></div>
<div style="display:flex;justify-content:space-between"><span>6. Faith and the leap</span><span class="meta">1:20</span></div>
<div class="meta" style="margin-top:12px;line-height:1.5">Featuring Kierkegaard, Nietzsche, Sartre, Beauvoir, Camus, Heidegger</div></div>
<div class="fold" style="grid-column:1/-1">Liner notes (the article) ↓</div></div>
<figcaption><b>7 · Record sleeve, back side</b>The six ideas as a tracklist with reading times, credits for the thinkers, one liner quote.</figcaption></figure>

<!-- 8 Constellation -->
<figure><div class="p" style="padding:0">
<svg viewBox="0 0 720 450" width="100%" height="100%">
<text class="st" x="40" y="58" font-size="28" font-weight="300">Existentialism</text>
<text x="40" y="80" font-size="12">Six constellations, six ideas</text>
<g stroke="rgba(233,226,212,.25)" fill="none"><path d="M150 160 L190 140 L215 175"/><path d="M330 120 L370 150 L350 185"/><path d="M520 150 L560 130 L585 165 L550 190"/><path d="M180 300 L220 330 L260 305"/><path d="M380 290 L420 270 L440 310"/><path d="M560 300 L600 320"/></g>
<g fill="#e9e2d4"><circle cx="150" cy="160" r="2.5"/><circle cx="190" cy="140" r="2.5"/><circle cx="215" cy="175" r="2.5"/><circle cx="330" cy="120" r="2.5"/><circle cx="370" cy="150" r="2.5"/><circle cx="350" cy="185" r="2.5"/><circle cx="520" cy="150" r="2.5"/><circle cx="560" cy="130" r="2.5"/><circle cx="585" cy="165" r="2.5"/><circle cx="550" cy="190" r="2.5"/><circle cx="180" cy="300" r="2.5"/><circle cx="220" cy="330" r="2.5"/><circle cx="260" cy="305" r="2.5"/><circle cx="380" cy="290" r="2.5"/><circle cx="420" cy="270" r="2.5"/><circle cx="440" cy="310" r="2.5"/><circle cx="560" cy="300" r="2.5"/><circle cx="600" cy="320" r="2.5"/></g>
<g font-size="11.5"><text x="182" y="205" text-anchor="middle">Existence before essence</text><text x="352" y="210" text-anchor="middle">Freedom and anxiety</text><text x="552" y="215" text-anchor="middle">Authenticity vs the crowd</text><text x="220" y="355" text-anchor="middle">Meaning without guarantees</text><text x="410" y="335" text-anchor="middle">My freedom needs yours</text><text x="580" y="345" text-anchor="middle">Faith and the leap</text></g>
</svg><div class="fold">Article ↓</div></div>
<figcaption><b>8 · Constellation</b>The school's dot opens into a small sky: six star groups for the ideas, the thinkers as stars.</figcaption></figure>

</div></body></html>
