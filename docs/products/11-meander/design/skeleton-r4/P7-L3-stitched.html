/* ---------- round 4 shared: the fixed A1 knot ---------- */
html,body{width:100%;height:100%;overflow:hidden;background:#0c1413}
.screen{position:absolute;left:0;top:0;transform-origin:0 0;opacity:0;--ease-out:cubic-bezier(.23,1,.32,1);--ease-move:cubic-bezier(.6,.04,.25,1)}
.screen.ready{opacity:1}
.nw{white-space:nowrap}
a{color:inherit;text-decoration:none}
/* display serif: sturdier cut (low optical size, regular weight) and opened tracking; r3's was thin and tight */
.d{font-family:Fraunces,serif;font-weight:400;font-optical-sizing:none;font-variation-settings:'opsz' 40;letter-spacing:-.008em;text-wrap:balance}
.d i,.d.it{font-style:italic;font-weight:380}
/* globe layer */
.globe{position:absolute;inset:0;transform-origin:500px 456px;transform:translate(220px,-6px);transition:transform 560ms var(--ease-move);will-change:transform}
.globe svg.threads{transition:opacity 400ms ease}
.globe svg.threads path,.globe .yarn ellipse,.globe .yarn circle{vector-effect:non-scaling-stroke}
.globe .nodes{transition:opacity 240ms ease,visibility 0s}
.title{cursor:pointer}
.title .h1{font:400 37px/1.04 Fraunces,serif;font-optical-sizing:none;font-variation-settings:'opsz' 40;letter-spacing:-.012em}
.title .p{font-size:13.5px;color:rgba(233,226,212,.84);margin-top:9px;white-space:nowrap}
.title .here{transition:box-shadow 200ms ease}
.title:active{transform:translate(-50%,-50%) scale(.98)}
.screen:not([data-state="1"]) .globe{transform:translate(var(--dx),var(--dy)) scale(1.9)}
.screen:not([data-state="1"]) .globe .nodes{opacity:0;visibility:hidden;transition:opacity 200ms ease,visibility 0s 200ms}
.screen:not([data-state="1"]) .globe svg.threads{opacity:.5}
.screen:not([data-state="1"]) .globe svg.threads path.focus{stroke-opacity:.3;stroke-width:1;stroke-dasharray:none}
/* the pool and veils: globe lines dim to nothing behind any text */
.pool,.veil{position:absolute;pointer-events:none;opacity:0;transition:opacity 400ms ease}
.pool{transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(15,24,23,.96) 0%,rgba(15,24,23,.94) 70%,rgba(15,24,23,0) 100%)}
.screen:not([data-state="1"]) .pool,.screen:not([data-state="1"]) .veil{opacity:1}
/* the knot */
.knotwrap{position:absolute;inset:0;opacity:0;visibility:hidden;transform:scale(.9);transition:opacity 200ms ease,transform 200ms ease,visibility 0s 200ms}
.screen:not([data-state="1"]) .knotwrap{opacity:1;visibility:visible;transform:none;transition:opacity 360ms ease,transform 420ms var(--ease-out),visibility 0s}
.screen.entering .knotwrap{transition-delay:180ms,180ms,0s}
svg.ov{position:absolute;inset:0;width:1440px;height:900px;pointer-events:none;overflow:visible}
svg.ov path{fill:none;stroke:var(--brass);stroke-linecap:round}
svg.ov .sp{stroke-width:1.25;stroke-opacity:.62;transition:stroke-opacity 200ms ease}
svg.ov .sp.first{stroke-opacity:1;stroke-width:1.7}
svg.ov .bead{fill:var(--bone);transition:opacity 200ms ease}
svg.ov .bead.first{fill:var(--brass)}
svg.ov .loop{stroke-width:1.2;stroke-opacity:.55}
.screen[data-state="3"] svg.ov .sp:not(.on){stroke-opacity:.2;stroke-width:1.25}
.screen[data-state="3"] svg.ov .bead:not(.on){opacity:.4}
.screen[data-state="3"] svg.ov .sp.on{stroke-opacity:1;stroke-width:2}
.screen[data-state="3"] svg.ov .bead.on{fill:var(--brass)}
.knot{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--brass);transform:translate(-50%,-50%);box-shadow:0 0 0 8px rgba(211,166,108,.16),0 0 50px 16px rgba(211,166,108,.1)}
.idea{position:absolute;width:max-content;max-width:256px;transition:opacity 200ms ease}

.idea .tt{font:400 23px/1.2 Fraunces,serif;font-optical-sizing:none;font-variation-settings:'opsz' 36;letter-spacing:0;color:rgba(233,226,212,.9);text-wrap:balance;overflow-wrap:break-word}

};
})();

<script>window.WEB={"c":[500,456],"R":410,"w":1440,"h":900};</script><script>
(function(){
const S=document.querySelector('.screen'),W=window.WEB;if(!S||!W)return;
function run(){
  const sb=S.getBoundingClientRect();
  const rectOf=e=>{const r=e.getBoundingClientRect();return{x:r.left-sb.left,y:r.top-sb.top,w:r.width,h:r.height,id:e.dataset.id||e.className}};
  const fixed=[...S.querySelectorAll('.solid')].map(rectOf);
  const nodes=[...S.querySelectorAll('.n')].map(e=>({e,id:e.dataset.id,lb:e.querySelector('.lb'),x:+e.dataset.x,y:+e.dataset.y,r:+e.dataset.r,pref:+e.dataset.pref,ord:+e.dataset.ord}));
  const pts=[];S.querySelectorAll('svg.threads path.th').forEach(p=>{const n=p.getTotalLength(),w=p.classList.contains('focus')?14:1;for(let s=0;s<=n;s+=4){const q=p.getPointAtLength(s);pts.push([q.x,q.y,w,p.dataset.a+'-'+p.dataset.b])}});
  const placed=[];
  const hit=(a,b,pad)=>a.x<b.x+b.w+pad&&b.x<a.x+a.w+pad&&a.y<b.y+b.h+pad&&b.y<a.y+a.h+pad;
  nodes.slice().sort((a,b)=>a.ord-b.ord).forEach(n=>{
    const w=n.lb.offsetWidth,h=n.lb.offsetHeight;let best=null;
    const cand=[];[9,20,32].forEach((gap,gi)=>[0,30,-30,60,-60,90,-90,120,-120,150,-150,180].forEach((d,i)=>cand.push([d,n.r+gap,i*2+gi*9])));
    cand.forEach(([d,g,base])=>{const i=base/2;
      const a=(n.pref+d)*Math.PI/180,c=Math.cos(a),s=Math.sin(a),ax=n.x+g*c,ay=n.y+g*s;
      const x=c>.38?ax:c<-.38?ax-w:ax-w/2,y=s>.38?ay:s<-.38?ay-h:ay-h/2,R={x,y,w,h};
      let cost=base;
      placed.forEach(p=>{if(hit(R,p,6))cost+=5000});fixed.forEach(p=>{if(hit(R,p,8))cost+=5000});
      nodes.forEach(m=>{if(m!==n){const nx=Math.max(x,Math.min(m.x,x+w)),ny=Math.max(y,Math.min(m.y,y+h));const dm=Math.hypot(nx-m.x,ny-m.y);if(dm<m.r+8)cost+=4500;else if(dm<g+10)cost+=2500}});
      [[x,y],[x+w,y],[x,y+h],[x+w,y+h]].forEach(k=>{if(Math.hypot(k[0]-W.c[0],k[1]-W.c[1])>W.R-4)cost+=450});
      if(x<8||y<8||x+w>W.w-8||y+h>W.h-8)cost+=3000;
      for(const q of pts){if(q[0]>x-3&&q[0]<x+w+3&&q[1]>y-3&&q[1]<y+h+3)cost+=7*q[2]}
      if(!best||cost<best.cost)best={cost,x,y,al:c>.38?'flex-start':c<-.38?'flex-end':'center',ta:c>.38?'left':c<-.38?'right':'center'}});
    n.lb.style.left=(best.x-n.x)+'px';n.lb.style.top=(best.y-n.y)+'px';n.lb.style.alignItems=best.al;n.lb.style.textAlign=best.ta;n.lb.style.visibility='visible';
    placed.push({x:best.x,y:best.y,w,h,id:n.id});
  });
  // a thread never draws through a label: labels knock out whatever passes behind them
  const ko=S.querySelector('#ko');if(ko)placed.concat([...S.querySelectorAll('.kox')].map(rectOf)).forEach(p=>{const r=document.createElementNS('http://www.w3.org/2000/svg','rect');r.setAttribute('x',p.x-5);r.setAttribute('y',p.y-3);r.setAttribute('width',p.w+10);r.setAttribute('height',p.h+6);r.setAttribute('rx',6);r.setAttribute('fill','#000');ko.appendChild(r)});
  if(location.hash==='#check'){
    const out=[];
    placed.forEach(p=>{const t=new Set();pts.forEach(q=>{if(q[0]>p.x-1&&q[0]<p.x+p.w+1&&q[1]>p.y-1&&q[1]<p.y+p.h+1)t.add(q[3])});t.forEach(k=>out.push('THREAD '+k+' x LABEL '+p.id));
      fixed.forEach(f=>{if(hit(p,f,0))out.push('LABEL '+p.id+' x '+f.id)});
      if(p.x<8||p.y<8||p.x+p.w>W.w-8||p.y+p.h>W.h-8)out.push('OFFSCREEN '+p.id);
      if([[p.x,p.y],[p.x+p.w,p.y],[p.x,p.y+p.h],[p.x+p.w,p.y+p.h]].some(k=>Math.hypot(k[0]-W.c[0],k[1]-W.c[1])>W.R+2))out.push('OUTSIDE GLOBE '+p.id);
      nodes.forEach(m=>{if(m.id!==p.id){const nx=Math.max(p.x,Math.min(m.x,p.x+p.w)),ny=Math.max(p.y,Math.min(m.y,p.y+p.h));if(Math.hypot(nx-m.x,ny-m.y)<m.r+1)out.push('LABEL '+p.id+' x DOT '+m.id)}})});
    for(let i=0;i<placed.length;i++)for(let j=i+1;j<placed.length;j++)if(hit(placed[i],placed[j],0))out.push('LABEL '+placed[i].id+' x LABEL '+placed[j].id);
    fixed.filter(f=>!/title|sat/.test(f.id)).forEach(f=>{const t=new Set();pts.forEach(q=>{if(q[0]>f.x&&q[0]<f.x+f.w&&q[1]>f.y&&q[1]<f.y+f.h)t.add(q[3])});t.forEach(k=>out.push('THREAD '+k+' x '+f.id))});
    const pre=document.createElement('pre');pre.id='chk';pre.textContent='CHECK\n'+out.join('\n')+'\nEND';document.body.appendChild(pre);
  }
}
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(()=>{run();window.__ready&&window.__ready()},60));
})();</script>
