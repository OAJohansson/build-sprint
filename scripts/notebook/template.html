<title>Build Sprint Notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a training log. Contents rail on wide screens, drawer on phones; one narrow reading column. */
:root {
  --bg: #f4f5f2;
  --surface: #fdfdfb;
  --rail: #eceee9;
  --ink: #1b1f1c;
  --muted: #5f6762;
  --line: #d9ddd6;
  --accent: #2446c9;
  --accent-soft: #e2e7fb;
  --ok: #1d7a4a; --ok-soft: #dcf0e4;
  --warn: #9a5b00; --warn-soft: #f8ead2;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121513; --surface: #191d1a; --rail: #161917; --ink: #e9ece7; --muted: #9aa39d;
    --line: #2b312d; --accent: #8ea4ff; --accent-soft: #232b4d;
    --ok: #6fd39b; --ok-soft: #173325; --warn: #f0b45a; --warn-soft: #3a2a12;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121513; --surface: #191d1a; --rail: #161917; --ink: #e9ece7; --muted: #9aa39d;
  --line: #2b312d; --accent: #8ea4ff; --accent-soft: #232b4d;
  --ok: #6fd39b; --ok-soft: #173325; --warn: #f0b45a; --warn-soft: #3a2a12;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.shell { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 100vh; }

/* rail */
.rail { background: var(--rail); border-right: 1px solid var(--line); position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; padding-block: 24px 40px; padding-inline: 16px; font-size: 14px; }
.brand { display: block; font: 700 20px/1.1 var(--display); color: var(--ink); text-decoration: none; padding-inline: 8px; margin-bottom: 4px; }
.brand-sub { font: 12px var(--mono); color: var(--muted); padding-inline: 8px; margin: 0 0 18px; }
.nav-label { font: 600 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 18px 8px 6px; }
.nav { list-style: none; margin: 0; padding: 0; display: grid; gap: 1px; }
.nav a { display: flex; gap: 10px; align-items: baseline; padding: 6px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; }
.nav a:hover { background: var(--line); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav .d { font: 12px var(--mono); color: var(--muted); min-width: 2ch; }
.nav .t { flex: 1; min-width: 0; }
.empty-nav { color: var(--muted); padding: 4px 8px; font-size: 13px; }
.subnav { list-style: none; margin: 2px 0 8px 22px; padding: 0 0 0 10px; border-left: 1px solid var(--line); display: grid; gap: 1px; }
.subnav a { padding: 4px 8px; font-size: 13px; color: var(--muted); }
.subnav a[aria-current="page"] { color: var(--accent); background: var(--accent-soft); }

/* product sub-pages */
.sections { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 180px), 1fr)); gap: 10px; }
.section-card { display: flex; flex-direction: column; gap: 2px; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); text-decoration: none; }
.section-card:hover { border-color: var(--accent); }
.section-card .t { font-weight: 600; }
.section-card .p { font: 12px var(--mono); color: var(--muted); }
.crumbs { font: 12px var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px; }
.crumbs a { color: var(--muted); }
.prose pre { white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.5 var(--mono); }
.prose hr { border: 0; border-top: 1px solid var(--line); margin: 32px 0; }
.prose h3 { font: 600 16px/1.3 var(--body); margin: 20px 0 8px; }

/* phone top bar */
.topbar { display: none; }
@media (max-width: 820px) {
  .shell { grid-template-columns: 1fr; }
  .topbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding-block: 10px; padding-inline: 16px; }
  .topbar .brand { padding: 0; margin: 0; font-size: 18px; }
  .menu-btn { font: 500 14px var(--body); color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
  .rail { position: fixed; inset: 0 auto 0 0; z-index: 10; width: min(300px, 86vw); height: 100%; transform: translateX(-100%); transition: transform .2s ease; }
  .rail.open { transform: none; box-shadow: 0 0 40px rgb(0 0 0 / .2); }
  .scrim { position: fixed; inset: 0; z-index: 9; background: rgb(0 0 0 / .35); }
}
@media (prefers-reduced-motion: reduce) { .rail { transition: none; } }

/* main column */
main { padding-block: 40px 72px; padding-inline: clamp(16px, 5vw, 56px); min-width: 0; }
.col { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; }
.eyebrow { font: 12px var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
h1 { font: 700 clamp(28px, 6vw, 38px)/1.1 var(--display); letter-spacing: -.01em; margin: 0; text-wrap: balance; }
h2 { font: 700 20px/1.2 var(--display); margin: 0; text-wrap: balance; }
.lede { color: var(--muted); margin: 0; max-width: 60ch; }
.head { display: flex; flex-direction: column; gap: 10px; }

/* 20-day strip */
.strip { display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 6px; }
.cell { aspect-ratio: 1; max-width: 100%; border-radius: 6px; border: 1px dashed var(--line); display: grid; place-items: center; font: 12px var(--mono); color: var(--muted); text-decoration: none; }
.cell.shipped { background: var(--ok); border: 0; color: var(--surface); }
.cell.building { background: var(--warn-soft); border: 1px solid var(--warn); color: var(--warn); }
.cell.parked { background: var(--line); border: 0; }
.tally { font: 13px var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 16px; }
.tally b { color: var(--ink); font-weight: 500; font-variant-numeric: tabular-nums; }

/* product list */
.list { display: grid; gap: 10px; }
.row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 4px 14px; align-items: baseline; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; color: var(--ink); text-decoration: none; }
.row:hover { border-color: var(--accent); }
.row .d { font: 500 13px var(--mono); color: var(--muted); grid-row: span 2; }
.row .t { font-weight: 600; }
.row .p { grid-column: 2 / 4; color: var(--muted); font-size: 14px; }
.pill { font: 500 11px var(--body); letter-spacing: .04em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--line); color: var(--muted); white-space: nowrap; }
.pill.shipped { background: var(--ok-soft); color: var(--ok); }
.pill.building { background: var(--warn-soft); color: var(--warn); }
.empty { padding: 20px; border: 1px dashed var(--line); border-radius: 10px; color: var(--muted); }
.empty code, .prose code { font: 13px var(--mono); background: var(--rail); padding: 1px 5px; border-radius: 4px; }

/* product page */
.facts { display: grid; gap: 0; border-top: 1px solid var(--line); margin: 0; }
.fact { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 16px; padding-block: 14px; border-bottom: 1px solid var(--line); }
.fact dt { font: 600 11px var(--body); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-top: 3px; }
.fact dd { margin: 0; font-size: 17px; }
.fact dd.blank { color: var(--muted); font-style: italic; font-size: 15px; }
@media (max-width: 480px) { .fact { grid-template-columns: 1fr; gap: 4px; } }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); text-decoration: none; font-weight: 500; font-size: 14px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.off { color: var(--muted); border-style: dashed; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font: 12px var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }

/* markdown */
.prose { min-width: 0; }
.prose > :first-child { margin-top: 0; }
.prose h1 { font-size: 28px; margin-bottom: 12px; }
.prose h2 { margin: 28px 0 10px; }
.prose p, .prose ul, .prose ol { margin: 0 0 12px; }
.prose ul, .prose ol { padding-left: 1.2em; }
.prose li::marker { color: var(--accent); }
.prose .tw { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); margin: 0 0 16px; }
.prose table { border-collapse: collapse; width: 100%; font-size: 14px; }
.prose th, .prose td { text-align: left; vertical-align: top; padding: 9px 12px; border-bottom: 1px solid var(--line); }
.prose th { font: 600 11px var(--body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--rail); }
.prose tr:last-child td { border-bottom: 0; }
.foot { font: 12px var(--mono); color: var(--muted); border-top: 1px solid var(--line); padding-top: 14px; }
</style>

<div class="topbar">
  <a class="brand" href="#overview">Build Sprint</a>
  <button class="menu-btn" id="menu-btn" type="button" aria-expanded="false" aria-controls="rail">Contents</button>
</div>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Contents">
    <a class="brand" href="#overview">Build Sprint</a>
    <p class="brand-sub">20 products · 20 days</p>
    <ul class="nav" id="nav-pages"></ul>
    <p class="nav-label">Products</p>
    <ul class="nav" id="nav-products"></ul>
  </nav>
  <main><div class="col" id="view"></div></main>
</div>
<div class="scrim" id="scrim" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>
const DATA = /*DATA*/null;
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nn = (d) => String(d).padStart(2, "0");
const md = (text) => {
  const html = window.marked ? marked.parse(text) : `<pre>${esc(text)}</pre>`;
  return html.replace(/<table>/g, '<div class="tw"><table>').replace(/<\/table>/g, "</table></div>");
};
const STATUS = { shipped: "Shipped", building: "Building", parked: "Parked", idea: "Idea" };
const pill = (s) => `<span class="pill ${esc(s)}">${esc(STATUS[s] || s)}</span>`;

// Routes: "overview", a sprint page ("playbook", "skills", "learnings", "todo"), "<slug>" (product
// overview) or "<slug>.<section>" (product sub-page).
function parseRoute() {
  const route = decodeURIComponent(location.hash.slice(1)) || "overview";
  const [slug, sectionId] = route.split(".");
  const p = DATA.products.find((x) => x.slug === slug);
  const section = p && sectionId ? p.sections.find((s) => s.id === sectionId) : null;
  const page = !p ? DATA.pages.find((x) => x.id === route) : null;
  return { route: p ? (section ? `${p.slug}.${section.id}` : p.slug) : page ? page.id : "overview", p, section, page };
}

function nav(current) {
  $("#nav-pages").innerHTML = [{ id: "overview", label: "Overview" }, ...DATA.pages]
    .map((pg) => `<li><a href="#${pg.id}" data-route="${pg.id}"><span class="t">${esc(pg.label)}</span></a></li>`).join("");
  $("#nav-products").innerHTML = DATA.products.length
    ? DATA.products.map((p) => {
        const open = current.p && current.p.slug === p.slug;
        const sub = open && p.sections.length
          ? `<ul class="subnav"><li><a href="#${p.slug}" data-route="${p.slug}">Overview</a></li>${p.sections.map((s) =>
              `<li><a href="#${p.slug}.${s.id}" data-route="${p.slug}.${s.id}">${esc(s.label)}</a></li>`).join("")}</ul>`
          : "";
        return `<li><a href="#${p.slug}" data-route="${open ? "" : p.slug}"><span class="d">${nn(p.day)}</span><span class="t">${esc(p.title)}</span></a>${sub}</li>`;
      }).join("")
    : `<li class="empty-nav">None yet</li>`;
}

function overview() {
  const by = Object.fromEntries(DATA.products.map((p) => [p.day, p]));
  const count = (s) => DATA.products.filter((p) => p.status === s).length;
  const cells = Array.from({ length: DATA.total }, (_, i) => {
    const p = by[i + 1];
    return p
      ? `<a class="cell ${esc(p.status)}" href="#${p.slug}" title="Day ${i + 1}: ${esc(p.title)}">${i + 1}</a>`
      : `<span class="cell" title="Day ${i + 1}">${i + 1}</span>`;
  }).join("");
  const rows = DATA.products.length
    ? `<div class="list">${DATA.products.map((p) => `
        <a class="row" href="#${p.slug}">
          <span class="d">${nn(p.day)}</span><span class="t">${esc(p.title)}</span>${pill(p.status)}
          <span class="p">${esc(p.problem || "Problem not written yet")}</span>
        </a>`).join("")}</div>`
    : `<div class="empty">No products yet. Day 1 starts with <code>pnpm new &lt;slug&gt;</code>.</div>`;
  return `
    <header class="head">
      <div class="eyebrow">Overview</div>
      <h1>20 products in 20 days</h1>
      <p class="lede">One product a day: who it's for, the problem, the bet, and what I learned.</p>
    </header>
    <section class="head" aria-label="Progress">
      <div class="strip">${cells}</div>
      <div class="tally"><span><b>${count("shipped")}</b>/${DATA.total} shipped</span><span><b>${count("building")}</b> building</span><span><b>${count("parked")}</b> parked</span></div>
    </section>
    <section class="head"><h2>Products</h2>${rows}</section>
    <section class="head"><h2>Product ideas</h2><div class="prose">${md(DATA.ideas)}</div></section>
    <div class="links">${DATA.pages.map((pg) => `<a class="btn" href="#${pg.id}">${esc(pg.label)}</a>`).join("")}<a class="btn" href="${DATA.repo}">Code on GitHub</a></div>`;
}

function sprintPage(pg) {
  return `
    <header class="head">
      <div class="eyebrow">${esc(pg.eyebrow)}</div>
      <h1>${esc(pg.title)}</h1>
    </header>
    <section class="prose">${md(pg.text)}</section>
    <div class="links"><a class="btn" href="${esc(pg.source)}">Edit on GitHub</a></div>`;
}

function product(p) {
  const fact = (label, value) => `<div class="fact"><dt>${label}</dt><dd class="${value ? "" : "blank"}">${esc(value || "Not written yet")}</dd></div>`;
  const live = p.url ? `<a class="btn primary" href="${esc(p.url)}">Open app ↗</a>` : `<span class="btn off">Not deployed yet</span>`;
  const design = p.design ? `<a class="btn" href="${esc(p.design)}">Design canvas ↗</a>` : "";
  const cards = p.sections.length
    ? `<section class="head"><h2>In this product</h2><div class="sections">${p.sections.map((s) =>
        `<a class="section-card" href="#${p.slug}.${s.id}"><span class="t">${esc(s.label)}</span><span class="p">${esc(s.summary)}</span></a>`).join("")}</div></section>`
    : "";
  const body = p.body.replace(/^##\s*Learned\s*\n+-\s*$/m, "").trim();
  return `
    <header class="head">
      <div class="eyebrow"><span>Day ${nn(p.day)}</span><span>${esc(p.date)}</span>${pill(p.status)}</div>
      <h1>${esc(p.title)}</h1>
    </header>
    <dl class="facts">${fact("User", p.user)}${fact("Problem", p.problem)}${fact("Bet", p.bet)}</dl>
    <div class="links">${live}${design}<a class="btn" href="${p.code}">Code</a><a class="btn" href="${p.doc}">Edit notes</a></div>
    ${p.tags.length ? `<div class="tags">${p.tags.map((t) => `<span class="tag">${esc(t)}</span>`).join("")}</div>` : ""}
    ${cards}
    <section class="prose">${body ? md(body) : `<h2>Learned</h2><p class="lede">Filled in at the end of the day.</p>`}</section>`;
}

function sectionPage(p, s) {
  return `
    <div class="crumbs"><a href="#${p.slug}">${nn(p.day)} ${esc(p.title)}</a><span>/</span><span>${esc(s.label)}</span></div>
    <section class="prose">${md(s.text)}</section>`;
}

function render() {
  const current = parseRoute();
  const { p, section, page } = current;
  const html = section ? sectionPage(p, section) : p ? product(p) : page ? sprintPage(page) : overview();
  $("#view").innerHTML = html + `<div class="foot">Built ${esc(DATA.built)} from docs/ in the repo</div>`;
  nav(current);
  document.querySelectorAll("[data-route]").forEach((a) =>
    a.dataset.route === current.route ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  document.title = p ? `${p.title}${section ? ` · ${section.label}` : ""} · Build Sprint Notebook` : page ? `${page.label} · Build Sprint Notebook` : "Build Sprint Notebook";
  setMenu(false);
  window.scrollTo(0, 0);
}

function setMenu(open) {
  $("#rail").classList.toggle("open", open);
  $("#scrim").hidden = !open;
  $("#menu-btn").setAttribute("aria-expanded", String(open));
}
$("#menu-btn").addEventListener("click", () => setMenu(!$("#rail").classList.contains("open")));
$("#scrim").addEventListener("click", () => setMenu(false));
document.addEventListener("keydown", (e) => { if (e.key === "Escape") setMenu(false); });
window.addEventListener("hashchange", render);
render();
</script>
